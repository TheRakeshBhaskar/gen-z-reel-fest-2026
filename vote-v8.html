<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public Voting V8 - GEN Z REEL FEST 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}
.wrap{max-width:1100px;margin:auto;padding:20px 14px 50px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #1018280a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}
.btn:disabled{opacity:.65;cursor:not-allowed}
.dark{background:#111827}
.ok{background:#ecfdf3;padding:12px;border-radius:9px}
.err{background:#fef2f2;padding:12px;border-radius:9px}
.muted{color:#667085}
.card h2{margin-top:0}
input{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;box-sizing:border-box}
.vote{width:100%;margin-top:10px}
.count{font-size:14px;color:#475467}
.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const CONFIG={
  SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',
  SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'
};

const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let entries=[];
let hasVoted=false;

async function init(){
  const{data:{user}}=await sb.auth.getUser();
  renderShell(!!user);
  if(user)await load();
  else renderLoggedOut();

  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user){
      renderShell(true);
      await load();
    }
  });
}

function renderShell(logged){
  app.innerHTML='<div class="card"><h1>🗳️ GEN Z REEL FEST 2026</h1><p>Public Voting</p><div id="msg"></div>'+
    (!logged
      ? '<input id="email" type="email" placeholder="Enter your email for one-time voting login"><br><br><button class="btn" onclick="send()">LOGIN TO VOTE</button>'
      : '<div class="ok">✅ You are logged in. '+(hasVoted?'Your vote has already been recorded.':'Select one finalist and cast your vote.')+'</div>')+
    '</div><div class="card"><div id="list"></div></div>';
}

function renderLoggedOut(){
  document.getElementById('list').innerHTML='<p class="muted">Please login first. Finalists will appear here after your email is verified.</p>';
}

async function send(){
  const e=document.getElementById('email').value.trim();
  if(!e){msg.innerHTML='<div class="err">Please enter your email.</div>';return}
  const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});
  msg.innerHTML=error
    ? '<div class="err">'+esc(error.message)+'</div>'
    : '<div class="ok">Login link sent. Open the email link. You will return here automatically and the finalists will load.</div>';
}

async function load(){
  list.innerHTML='<p class="muted">Loading finalists...</p>';

  const{data:{user}}=await sb.auth.getUser();
  if(!user){hasVoted=false;renderLoggedOut();return}

  const voteCheck=await sb.from('votes').select('id').eq('voter_id',user.id).limit(1);
  if(voteCheck.error){
    list.innerHTML='<div class="err">'+esc(voteCheck.error.message)+'</div>';
    return;
  }
  hasVoted=!!voteCheck.data?.length;

  const r=await sb.from('entries')
    .select('id,registration_id,name,title,district,category,status,is_finalist,public_votes')
    .eq('is_finalist',true)
    .order('created_at',{ascending:true});

  if(r.error){
    list.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';
    return;
  }

  entries=r.data||[];
  renderEntries();
  updateLoginMessage();
}

function updateLoginMessage(){
  const box=document.querySelector('#app > .card:first-child');
  if(!box)return;
  const message=box.querySelector('.ok');
  if(message){
    message.textContent=hasVoted
      ? '✅ You are logged in. Your vote has already been recorded.'
      : '✅ You are logged in. Select one finalist and cast your vote.';
  }
}

function renderEntries(){
  list.innerHTML=entries.length
    ? '<h2>🏆 Finalists</h2><div class="grid">'+entries.map(e=>
        '<div class="card"><span class="tag">'+esc(e.registration_id)+'</span><h2>'+esc(e.title)+'</h2><p><b>'+esc(e.name)+'</b><br>'+esc(e.district||'')+' • '+esc(e.category||'')+'</p><div class="count">❤️ Public Votes: '+Number(e.public_votes||0)+'</div>'+
        (hasVoted
          ? '<button class="btn vote" disabled>✅ VOTE RECORDED</button>'
          : '<button class="btn vote" onclick="vote(\''+esc(e.id)+'\')">❤️ VOTE FOR THIS REEL</button>')+
        '</div>').join('')+'</div>'
    : '<p class="muted">No finalists are currently marked for public voting. Admin/Jury must mark finalists first.</p>';
}

async function vote(id){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){msg.innerHTML='<div class="err">Please login first.</div>';return}

  if(hasVoted){
    msg.innerHTML='<div class="err">You have already voted. One person can vote only once.</div>';
    return;
  }

  const{data:existing,error:checkError}=await sb.from('votes').select('id').eq('voter_id',user.id).limit(1);
  if(checkError){msg.innerHTML='<div class="err">'+esc(checkError.message)+'</div>';return}
  if(existing?.length){
    hasVoted=true;
    renderEntries();
    updateLoginMessage();
    msg.innerHTML='<div class="err">You have already voted. One person can vote only once.</div>';
    return;
  }

  const{error}=await sb.from('votes').insert({voter_id:user.id,entry_id:id});
  if(error){msg.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}

  hasVoted=true;
  msg.innerHTML='<div class="ok">✅ Your vote has been recorded successfully.</div>';
  await load();
}

init();
</script>
</body>
</html>
