<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Voting V8 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:20px 14px 50px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}.dark{background:#111827}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px}.muted{color:#667085}.score{font-size:22px;font-weight:800}.card h2{margin-top:0}input{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;box-sizing:border-box}.vote{width:100%;margin-top:10px}.count{font-size:14px;color:#475467} </style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let entries=[],votes=[];async function init(){app.innerHTML='<div class="card"><h1>🗳️ GEN Z REEL FEST 2026</h1><p>Public Voting</p><div id="msg"></div><input id="email" type="email" placeholder="Enter your email for one-time voting login"><br><br><button class="btn" onclick="send()">LOGIN TO VOTE</button></div><div class="card"><div id="list"></div></div>';await load()}async function send(){const e=email.value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email, then return here to vote.</div>'}async function load(){const r=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist').eq('is_finalist',true).order('created_at',{ascending:true});if(r.error){list.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}entries=r.data||[];const v=await sb.from('votes').select('*');votes=v.error?[]:(v.data||[]);render()}function count(e){return votes.filter(v=>String(v.registration_id??v.entry_registration_id??'')===String(e.registration_id)||String(v.entry_id??v.entryid??'')===String(e.id)).length}function render(){list.innerHTML=entries.length?'<div class="grid">'+entries.map(e=>'<div class="card"><h2>'+esc(e.title)+'</h2><p><b>'+esc(e.name)+'</b><br>'+esc(e.district||'')+' • '+esc(e.category||'')+'</p><div class="count">❤️ Votes: <span id="c-'+e.id+'">'+count(e)+'</span></div><button class="btn vote" onclick="vote(\''+esc(e.registration_id)+'\',\''+esc(e.id)+'\')">❤️ VOTE FOR THIS REEL</button></div>').join('')+'</div>':'<p class="muted">No finalists available for public voting.</p>'}async function vote(reg,id){const{data:{user}}=await sb.auth.getUser();if(!user){msg.innerHTML='<div class="err">Please enter your email and click LOGIN TO VOTE first.</div>';return}const{data:existing}=await sb.from('votes').select('id').eq('voter_id',user.id).maybeSingle();if(existing){msg.innerHTML='<div class="err">You have already voted. One person can vote only once.</div>';return}const{error}=await sb.from('votes').insert({voter_id:user.id,registration_id:reg,entry_id:id});if(error){msg.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}msg.innerHTML='<div class="ok">✅ Your vote has been recorded successfully.</div>';await load()}init();</script></body></html>
