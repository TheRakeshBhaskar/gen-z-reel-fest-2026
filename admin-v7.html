<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard V7 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1250px;margin:auto;padding:18px 14px 50px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f8f9fc;padding:16px;border-radius:14px}.num{font-size:30px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}.dark{background:#111827}.green{background:#059669}.red{background:#b42318}.orange{background:#b54708}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.filters{display:grid;grid-template-columns:1fr 180px 180px 180px;gap:10px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px}.muted{color:#667085}@media(max-width:800px){.filters{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let all=[];async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||!['admin','manager'].includes(p.role))return app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin or manager access required.</p></div>';dashboard()}function login(){app.innerHTML='<div class="card"><h2>🔐 Admin Login V7</h2><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function dashboard(){app.innerHTML='<div class="card"><h1>⚙️ Admin Dashboard V7</h1><p class="muted">Registration management, approvals, finalist control and audit overview.</p></div><div class="card"><div id="stats"></div></div><div class="card"><div class="filters"><input id="q" placeholder="Search registration, name, email or reel..." oninput="render()"><select id="status" onchange="render()"><option value="all">All status</option><option>pending</option><option>approved</option><option>shortlisted</option><option>finalist</option><option>rejected</option></select><select id="district" onchange="render()"><option value="all">All districts</option></select><select id="sort" onchange="render()"><option value="new">Newest</option><option value="score">Jury Score</option><option value="votes">Votes</option></select></div></div><div class="card"><div id="table"></div></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';await load()}async function load(){const{data,error}=await sb.from('entries').select('*').order('created_at',{ascending:false});if(error)return app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';all=data||[];const ds=[...new Set(all.map(x=>x.district).filter(Boolean))].sort();district.innerHTML='<option value="all">All districts</option>'+ds.map(x=>'<option>'+esc(x)+'</option>').join('');render()}function render(){const q=(document.getElementById('q')?.value||'').toLowerCase(),st=document.getElementById('status')?.value||'all',d=document.getElementById('district')?.value||'all',s=document.getElementById('sort')?.value||'new';let rows=all.filter(x=>(!q||[x.registration_id,x.name,x.email,x.title].join(' ').toLowerCase().includes(q))&&(st==='all'||x.status===st)&&(d==='all'||x.district===d));if(s==='score')rows.sort((a,b)=>(b.jury_total??-1)-(a.jury_total??-1));else if(s==='votes')rows.sort((a,b)=>(b.votes??0)-(a.votes??0));else rows.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));stats.innerHTML='<div class="grid"><div class="stat"><b>Total</b><div class="num">'+all.length+'</div></div><div class="stat"><b>Pending</b><div class="num">'+all.filter(x=>x.status==='pending').length+'</div></div><div class="stat"><b>Approved</b><div class="num">'+all.filter(x=>x.status==='approved').length+'</div></div><div class="stat"><b>Shortlisted</b><div class="num">'+all.filter(x=>x.status==='shortlisted').length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+all.filter(x=>x.is_finalist).length+'</div></div><div class="stat"><b>Scored</b><div class="num">'+all.filter(x=>x.jury_total!=null).length+'</div></div></div>';table.innerHTML=rows.length?'<div class="table"><table><tr><th>Registration</th><th>Participant</th><th>Reel</th><th>District</th><th>Status</th><th>Jury</th><th>Finalist</th><th>Actions</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.registration_id)+'</td><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.email)+'</small></td><td>'+esc(x.title)+'</td><td>'+esc(x.district)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td>'+(x.jury_total??'-')+'</td><td>'+(x.is_finalist?'🏆 Yes':'No')+'</td><td><button class="btn green" onclick="setStatus(\''+esc(x.registration_id)+'\',\'approved\')">APPROVE</button> <button class="btn orange" onclick="setStatus(\''+esc(x.registration_id)+'\',\'shortlisted\')">SHORTLIST</button> <button class="btn" onclick="toggleFinalist(\''+esc(x.registration_id)+'\','+(!x.is_finalist)+')">'+(x.is_finalist?'REMOVE FINALIST':'MAKE FINALIST')+'</button> <button class="btn red" onclick="setStatus(\''+esc(x.registration_id)+'\',\'rejected\')">REJECT</button></td></tr>').join('')+'</table></div>':'<p class="muted">No registrations found.</p>'}async function setStatus(id,status){const{error}=await sb.from('entries').update({status}).eq('registration_id',id);if(error)return alert(error.message);await load()}async function toggleFinalist(id,value){const{error}=await sb.from('entries').update({is_finalist:value,status:value?'finalist':'approved'}).eq('registration_id',id);if(error)return alert(error.message);await load()}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
