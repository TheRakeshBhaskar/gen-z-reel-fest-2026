<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V20 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1250px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:13px}.num{font-size:27px;font-weight:900}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.green{background:#12b76a}.red{background:#d92d20}.gold{background:#f59e0b;color:#111}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 180px 150px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:1200px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.top{background:#fffbeb}.rank{font-size:20px;font-weight:900}.score{font-size:18px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.btn{width:100%}}</style></head><body><main class="wrap" id="app"><div class="card">Loading...</div></main><script>(function(){'use strict';const C={url:'https://tewprfdirrhpaowvqyhj.supabase.co',key:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'},app=document.getElementById('app');let sb,role='',entries=[],scores=[],profiles={};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function fail(x){app.innerHTML='<div class="card err"><h2>⚠️ Error</h2><p>'+esc(x)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}async function init(){try{sb=supabase.createClient(C.url,C.key);const s=await sb.auth.getSession(),u=s.data.session?.user;if(!u)return login();const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(!['admin','manager'].includes(p.data?.role))return fail('Admin or Manager access is required.');role=p.data.role;renderShell(u.email);await load()}catch(e){fail(e.message)}}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login</h2><input id="em" type="email" placeholder="Admin email"><br><br><button class="btn" onclick="sendLogin()">SEND LOGIN LINK</button><div id="msg"></div></div>'}window.sendLogin=async()=>{const e=em.value.trim(),m=document.getElementById('msg');if(!e)return;m.innerHTML='Sending...';const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});m.innerHTML=r.error?'<div class="err">'+esc(r.error.message)+'</div>':'<div class="ok">Login link sent.</div>'};function renderShell(email){app.innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Admin • Finalists • Jury Scores • Ranking</p><span class="badge">'+esc(role.toUpperCase())+'</span></section><div class="card"><p><b>Signed in:</b> '+esc(email)+'</p><div class="grid" id="stats"></div></div><div class="card"><h2>Entries & Finalists</h2><p class="muted">Select <b>All Entries</b> to make a newly registered participant a Finalist. Finalists then appear in Jury scoring.</p><div class="filters"><input id="q" placeholder="Search registration, name, reel, district"><select id="scope"><option value="all">All Entries</option><option value="finalists">Finalists only</option><option value="scored">Scored only</option></select><select id="min"><option value="0">Any judges</option><option value="1">At least 1 judge</option><option value="2">At least 2 judges</option></select></div></div><div class="card"><div id="table"></div></div><div class="card">'+(role==='admin'?'<button class="btn gold" id="pub">PUBLISH TOP 3</button><button class="btn dark" onclick="location.href=\'results-v10.html\'">VIEW OFFICIAL RESULTS</button>':'')+' <button class="btn dark" onclick="logout()">LOGOUT</button><button class="btn dark" onclick="location.href=\'jury-manage-v23.html\'">JURY MANAGEMENT</button></div>';q.oninput=render;scope.onchange=render;min.onchange=render;if(role==='admin')pub.onclick=publish;window.logout=async()=>{await sb.auth.signOut();location.reload()}}async function load(){const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(a.error)throw a.error;entries=a.data||[];const j=await sb.from('jury_scores').select('entry_id,judge_id,creativity,content,performance,editing,local_connect,total').order('created_at',{ascending:true});if(j.error)throw j.error;scores=j.data||[];profiles={};const ids=[...new Set(scores.map(x=>x.judge_id).filter(Boolean))];if(ids.length){const p=await sb.from('profiles').select('id,full_name,email').in('id',ids);(p.data||[]).forEach(x=>profiles[x.id]=x)}render()}function calc(){const m={};scores.forEach(s=>(m[s.entry_id]??=[]).push(s));return entries.map(e=>{const list=m[e.id]||[],avg=list.length?list.reduce((a,x)=>a+Number(x.total||0),0)/list.length:0;return {...e,rows:list,judges:list.length,jury:avg}}).sort((a,b)=>b.jury-a.jury||Number(b.public_votes||0)-Number(a.public_votes||0))}function render(){const all=calc(),qv=(document.getElementById('q')?.value||'').toLowerCase(),sc=document.getElementById('scope')?.value||'all',mn=Number(document.getElementById('min')?.value||0),rows=all.filter(e=>{if(sc==='finalists'&&!e.is_finalist)return false;if(sc==='scored'&&!e.judges)return false;if(e.judges<mn)return false;return[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase().includes(qv)});stats.innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+entries.filter(e=>e.is_finalist).length+'</div></div><div class="stat"><b>Scored Entries</b><div class="num">'+all.filter(e=>e.judges).length+'</div></div><div class="stat"><b>Scored Finalists</b><div class="num">'+all.filter(e=>e.is_finalist&&e.judges).length+'</div></div><div class="stat"><b>Total Jury Scores</b><div class="num">'+scores.length+'</div></div>';table.innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Finalist</th><th>Jury Average</th><th>Judges</th><th>Public Votes</th><th>Action</th></tr>'+rows.map((e,i)=>'<tr class="'+(e.is_finalist?'top':'')+'"><td class="rank">'+(e.judges?i+1:'—')+'</td><td><b>'+esc(e.registration_id)+'</b></td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+(e.is_finalist?'✅ FINALIST':'—')+'</td><td class="score">'+(e.judges?e.jury.toFixed(2)+'/100':'—')+'</td><td>'+e.judges+'</td><td>'+Number(e.public_votes||0)+'</td><td>'+((role==='admin')?(e.is_finalist?'<button class="btn red toggle" data-id="'+e.id+'">REMOVE FINALIST</button>':'<button class="btn green toggle" data-id="'+e.id+'">MAKE FINALIST</button>'):'')+(e.judges?'<button class="btn dark detail" data-id="'+e.id+'">VIEW SCORES</button>':'')+'</td></tr>').join('')+'</table></div>':'<p class="muted">No entries found.</p>';document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggleFinalist(b.dataset.id));document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>details(b.dataset.id))}async function toggleFinalist(id){if(role!=='admin')return;const e=entries.find(x=>x.id===id);if(!e)return;if(!confirm((e.is_finalist?'Remove ':'Make ')+e.name+(e.is_finalist?' from Finalists?':' a Finalist?')))return;const r=await sb.from('entries').update({is_finalist:!e.is_finalist,status:!e.is_finalist?'Finalist':(e.status==='Finalist'?'Submitted':e.status)}).eq('id',id);if(r.error)return alert(r.error.message);await load()}function details(id){const e=calc().find(x=>x.id===id);if(!e)return;const html='<div class="card"><h2>🎯 Jury Score Details</h2><p><b>'+esc(e.name)+'</b> • '+esc(e.title)+'</p><p><b>Jury Average:</b> '+e.jury.toFixed(2)+'/100 &nbsp; <b>Judges:</b> '+e.judges+'</p><div class="table"><table><tr><th>Judge Name</th><th>Creativity</th><th>Content</th><th>Editing</th><th>Presentation</th><th>Local Connect</th><th>Total</th></tr>'+e.rows.map(s=>{const p=profiles[s.judge_id]||{};return '<tr><td><b>'+esc(p.full_name||p.email||'Judge')+'</b></td><td>'+s.creativity+'</td><td>'+s.content+'</td><td>'+s.editing+'</td><td>'+s.performance+'</td><td>'+s.local_connect+'</td><td><b>'+s.total+'/100</b></td></tr>'}).join('')+'</table></div><button class="btn dark" onclick="this.parentElement.remove()">CLOSE</button></div>';const d=document.createElement('div');d.innerHTML=html;document.getElementById('table').parentElement.insertAdjacentElement('afterend',d)}async function publish(){const rows=calc().filter(e=>e.is_finalist&&e.judges).slice(0,3);if(rows.length<3)return alert('At least 3 scored finalists are required.');const p=rows.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'})),r=await sb.from('results').upsert(p,{onConflict:'registration_id'});if(r.error)return alert(r.error.message);location.href='results-v10.html'}init()})()</script></body></html>
