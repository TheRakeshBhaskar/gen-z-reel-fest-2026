<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V27 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f6f7fb;color:#101828}.wrap{max-width:1450px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:12px}.num{font-size:27px;font-weight:900}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#7c3aed;color:white;margin:3px}.dark{background:#111827}.green{background:#12b76a}.red{background:#d92d20}.gold{background:#f59e0b;color:#111}.blue{background:#2563eb}.warn{background:#fffaeb;padding:12px;border-radius:9px;color:#92400e}.ok{background:#ecfdf3;padding:12px;border-radius:9px;color:#067647}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 180px 180px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:1450px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.top{background:#fffbeb}.rank,.score{font-weight:900}.complete{color:#067647;font-weight:900}.pending{color:#b54708;font-weight:900}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}.modal .card{max-width:1000px;width:100%;max-height:90vh;overflow:auto}@media(max-width:800px){.grid,.filters{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"><div class="card">Loading...</div></main><script>
(()=>{const S=window.supabase.createClient('https://tewprfdirrhpaowvqyhj.supabase.co','sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j');let entries=[],scores=[],profiles=[],judges=[],role='';const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const jname=j=>esc(j.full_name||j.email||'Judge');function error(e){app.innerHTML='<div class="card err"><h2>⚠️ Admin page error</h2>'+esc(e.message||e)+'</div>'}
async function init(){try{const {data:{session}}=await S.auth.getSession();if(!session)return login();const {data:p,error}=await S.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(error)throw error;if(!['admin','manager'].includes(p?.role))throw new Error('Admin or Manager access required.');role=p.role;await load(session.user.email)}catch(e){error(e)}}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login</h2><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" id="send">SEND LOGIN LINK</button><p id="msg"></p></div>';document.querySelector('#send').onclick=async()=>{const email=document.querySelector('#email').value.trim();const r=await S.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});document.querySelector('#msg').textContent=r.error?r.error.message:'Login link sent.'}}
async function load(email){let r=await S.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(r.error)throw r.error;entries=r.data||[];r=await S.from('profiles').select('id,full_name,email,role');if(r.error)throw r.error;profiles=r.data||[];judges=profiles.filter(x=>x.role==='judge');r=await S.from('jury_scores').select('id,entry_id,judge_id,creativity,content,performance,editing,local_connect,total,created_at').order('created_at',{ascending:true});if(r.error)throw r.error;scores=r.data||[];renderShell(email);render()}
function data(){const m={};scores.forEach(s=>(m[s.entry_id]??=[]).push(s));return entries.map(e=>{const rows=(m[e.id]||[]).filter(s=>judges.some(j=>j.id===s.judge_id));const ids=new Set(rows.map(s=>s.judge_id));const pending=judges.filter(j=>!ids.has(j.id));const avg=rows.length?rows.reduce((a,s)=>a+Number(s.total||0),0)/rows.length:0;const complete=!!e.is_finalist&&judges.length>0&&ids.size===judges.length;return {...e,rows,judges:ids.size,avg,complete,pending}})}function ranking(){return data().filter(e=>e.is_finalist&&e.complete).sort((a,b)=>b.avg-a.avg||Number(b.public_votes||0)-Number(a.public_votes||0))}
function renderShell(email){app.innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Admin • Judge-wise Scoring • Final Ranking</p></section><div class="card"><b>Signed in:</b> '+esc(email)+'<div class="grid" id="stats"></div></div><div class="card"><h2>⚖️ Jury Scoring Rule</h2><div class="warn"><b>Registered Judges:</b> <span id="jc"></span><br>प्रत्येक Finalist साठी registered Judges इतकेच scores valid आहेत. Extra score असल्यास सर्वात जास्त score असलेला extra score remove केला जाईल.</div><div id="notice" style="margin-top:10px"></div></div><div class="card"><h2>Entries & Finalists</h2><div class="filters"><input id="q" placeholder="Search registration, name, reel, district"><select id="filter"><option value="all">All Entries</option><option value="finalists">Finalists only</option><option value="pending">Pending Judges only</option><option value="scored">Scored only</option></select><select id="min"><option value="0">Any judges</option><option value="1">At least 1 judge</option><option value="2">At least 2 judges</option><option value="3">At least 3 judges</option></select></div></div><div class="card"><div id="table"></div></div><div class="card"><button class="btn gold" id="publish">PUBLISH TOP 3</button><button class="btn dark" id="official">VIEW OFFICIAL RESULTS</button><button class="btn dark" id="jury">JURY MANAGEMENT</button><button class="btn dark" id="logout">LOGOUT</button></div>';q.oninput=render;filter.onchange=render;min.onchange=render;publish.onclick=publishTop3;official.onclick=()=>location.href='results-v10.html';jury.onclick=()=>location.href='jury-manage-v23.html';logout.onclick=async()=>{await S.auth.signOut();location.reload()}}
function render(){const all=data(),ranked=ranking(),rm={};ranked.forEach((e,i)=>rm[e.id]=i+1);const qv=(q.value||'').toLowerCase(),f=filter.value,mn=+min.value,rows=all.filter(e=>{if(f==='finalists'&&!e.is_finalist)return false;if(f==='pending'&&(!e.is_finalist||e.complete))return false;if(f==='scored'&&!e.judges)return false;if(e.judges<mn)return false;return[e.registration_id,e.name,e.title,e.district].join(' ').toLowerCase().includes(qv)}),fin=all.filter(e=>e.is_finalist),pending=fin.filter(e=>!e.complete);stats.innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+fin.length+'</div></div><div class="stat"><b>Valid Ranked</b><div class="num">'+ranked.length+'</div></div><div class="stat"><b>Pending</b><div class="num">'+pending.length+'</div></div><div class="stat"><b>Total Jury Scores</b><div class="num">'+scores.length+'</div></div>';jc.textContent=judges.length;notice.innerHTML=pending.length?'<div class="warn"><b>Pending:</b><br>'+pending.map(e=>esc(e.name)+' ('+e.judges+'/'+judges.length+') — '+e.pending.map(jname).join(', ')).join('<br>')+'</div>':'<div class="ok"><b>All finalists are fully scored.</b> Final Ranking is valid.</div>';table.innerHTML='<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Finalist</th><th>Jury Average</th><th>Judges</th><th>Judge-wise Status</th><th>Public Votes</th><th>Action</th></tr>'+rows.map(e=>'<tr class="'+(e.is_finalist?'top':'')+'"><td class="rank">'+(rm[e.id]||'—')+'</td><td><b>'+esc(e.registration_id)+'</b></td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+((e.is_finalist)?'✅ FINALIST':'—')+'</td><td class="score">'+(e.judges?e.avg.toFixed(2)+'/100':'—')+'</td><td>'+e.judges+'/'+judges.length+'</td><td class="'+(e.complete?'complete':'pending')+'">'+(e.is_finalist?(e.complete?e.judges+'/'+judges.length+' ✅ All registered judges scored':e.judges+'/'+judges.length+' ⏳ Pending: '+e.pending.map(jname).join(', ')):'—')+'</td><td>'+Number(e.public_votes||0)+'</td><td>'+((role==='admin')?(e.is_finalist?'<button class="btn red tog" data-id="'+e.id+'">REMOVE FINALIST</button>':'<button class="btn green tog" data-id="'+e.id+'">MAKE FINALIST</button>'):'')+(e.is_finalist?'<button class="btn blue sc" data-id="'+e.id+'">🎯 SCORE</button><button class="btn dark dt" data-id="'+e.id+'">VIEW SCORES</button>':'')+'</td></tr>').join('')+'</table></div>';document.querySelectorAll('.tog').forEach(b=>b.onclick=()=>toggle(b.dataset.id));document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>location.href='jury-v19.html?entry='+b.dataset.id);document.querySelectorAll('.dt').forEach(b=>b.onclick=()=>details(b.dataset.id))}
async function toggle(id){if(role!=='admin')return;const e=entries.find(x=>x.id===id);if(!confirm((e.is_finalist?'Remove ':'Make ')+e.name+' '+(e.is_finalist?'from Finalists?':'a Finalist?')))return;const r=await S.from('entries').update({is_finalist:!e.is_finalist,status:!e.is_finalist?'Finalist':e.status}).eq('id',id);if(r.error)alert(r.error.message);else await load('')}
function details(id){const e=data().find(x=>x.id===id),d=document.createElement('div');d.className='modal';d.innerHTML='<div class="card"><h2>🎯 '+esc(e.name)+' • Jury Score Details</h2><p><b>Valid Average:</b> '+e.avg.toFixed(2)+'/100 &nbsp; <b>Completion:</b> '+e.judges+'/'+judges.length+'</p><div class="table"><table><tr><th>Judge Name</th><th>Creativity</th><th>Content</th><th>Editing</th><th>Presentation</th><th>Local Connect</th><th>Total</th></tr>'+judges.map(j=>{const s=e.rows.find(x=>x.judge_id===j.id);return s?'<tr><td><b>'+jname(j)+'</b></td><td>'+s.creativity+'</td><td>'+s.content+'</td><td>'+s.editing+'</td><td>'+s.performance+'</td><td>'+s.local_connect+'</td><td><b>'+s.total+'/100</b></td></tr>':'<tr><td><b>'+jname(j)+'</b></td><td colspan="6" class="pending">⏳ Pending</td></tr>'}).join('')+'</table></div><button class="btn dark" id="close">CLOSE</button></div>';document.body.appendChild(d);d.onclick=x=>{if(x.target===d)d.remove()};d.querySelector('#close').onclick=()=>d.remove()}
async function publishTop3(){const top=ranking().slice(0,3);if(judges.length===0)return alert('No registered Judges.');if(top.length<3)return alert('At least 3 fully scored finalists are required.');if(!confirm('Publish current valid Top 3?'))return;try{let r=await S.from('results').delete().neq('registration_id','__NO_MATCH__');if(r.error)throw r.error;const rows=top.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'}));r=await S.from('results').insert(rows);if(r.error)throw r.error;alert('Top 3 published successfully.');}catch(e){alert('Publish failed: '+(e.message||e))}}
init()})();</script></body></html>
