<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEN Z Reel Fest 2026 - Admin Dashboard V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.top{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;padding:25px}.top h1{margin:0 0 6px}.wrap{max-width:1400px;margin:25px auto;padding:0 18px}.bar,.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 5px 18px #1018280a}.bar{padding:15px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.metric{padding:18px;border-radius:12px;background:#f9fafb;border:1px solid #eaecf0}.metric b{display:block;font-size:30px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.controls input,.controls select{padding:11px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px}.table{overflow:auto;margin-top:15px}.table table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:11px;border-bottom:1px solid #eaecf0;text-align:left}.table th{background:#f9fafb}.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer;margin:2px}.purple{background:#7c3aed;color:#fff}.green{background:#12b76a;color:#fff}.orange{background:#f59e0b}.dark{background:#111827;color:#fff}.red{background:#ef4444;color:#fff}.muted{color:#667085}.status{padding:4px 8px;border-radius:20px;background:#f2f4f7;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:15px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:22px}.detailgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.detail{padding:10px;background:#f9fafb;border-radius:8px}.notice{padding:12px;border-radius:8px;margin:10px 0}.err{background:#fef2f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}@media(max-width:700px){.controls,.detailgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><h1>🔐 GEN Z REEL FEST 2026</h1><div>Admin / Jury Dashboard V2</div></header>
<main class="wrap" id="app"><div class="bar">Loading...</div></main>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);let rows=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const app=document.getElementById('app');
function notice(t,c='ok'){return `<div class="notice ${c}">${esc(t)}</div>`}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='./#';return}const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(pe||!p||!['admin','manager','judge'].includes(p.role)){app.innerHTML=notice('Admin/Jury access denied.','err');return}await load();}
async function load(){const {data,error}=await sb.from('entries').select('*').order('created_at',{ascending:false});if(error){app.innerHTML=notice(error.message,'err');return}rows=data||[];render();}
function render(){const q=(document.getElementById('q')?.value||'').toLowerCase();const st=document.getElementById('sf')?.value||'';const dist=document.getElementById('df')?.value||'';const fin=document.getElementById('ff')?.value||'';let list=rows.filter(x=>{const text=[x.registration_id,x.name,x.email,x.mobile,x.district,x.taluka,x.title].join(' ').toLowerCase();return(!q||text.includes(q))&&(!st||x.status===st)&&(!dist||x.district===dist)&&(!fin||(fin==='yes'?x.is_finalist:!x.is_finalist))});const total=rows.length,approved=rows.filter(x=>x.status==='Approved').length,short=rows.filter(x=>x.status==='Shortlisted').length,finalists=rows.filter(x=>x.is_finalist||x.status==='Finalist').length;const districts=[...new Set(rows.map(x=>x.district).filter(Boolean))].sort();app.innerHTML=`<div class="bar"><div class="grid"><div class="metric">Total Registrations<b>${total}</b></div><div class="metric">Approved<b>${approved}</b></div><div class="metric">Shortlisted<b>${short}</b></div><div class="metric">Finalists<b>${finalists}</b></div><div class="metric">Showing<b>${list.length}</b></div></div></div><div class="bar"><div class="controls"><input id="q" placeholder="Search ID, name, email, mobile, title..." value="${esc(q)}" oninput="render()"><select id="sf" onchange="render()"><option value="">All Status</option><option ${st==='Pending'?'selected':''}>Pending</option><option ${st==='Approved'?'selected':''}>Approved</option><option ${st==='Shortlisted'?'selected':''}>Shortlisted</option><option ${st==='Finalist'?'selected':''}>Finalist</option><option ${st==='Rejected'?'selected':''}>Rejected</option></select><select id="df" onchange="render()"><option value="">All Districts</option>${districts.map(d=>`<option ${dist===d?'selected':''}>${esc(d)}</option>`).join('')}</select><select id="ff" onchange="render()"><option value="">All Entries</option><option value="yes" ${fin==='yes'?'selected':''}>Finalists Only</option><option value="no" ${fin==='no'?'selected':''}>Non Finalists</option></select></div></div><div class="bar"><button class="btn dark" onclick="load()">↻ Refresh</button><button class="btn purple" onclick="location.href='./'">Website</button><button class="btn red" onclick="logout()">Logout</button><span class="muted" style="float:right">${list.length} records</span><div class="table"><table><thead><tr><th>Registration ID</th><th>Name</th><th>District</th><th>Category</th><th>Title</th><th>Status</th><th>Finalist</th><th>Votes</th><th>Actions</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.registration_id)}</b></td><td>${esc(x.name)}</td><td>${esc(x.district)}</td><td>${esc(x.category)}</td><td>${esc(x.title)}</td><td><span class="status">${esc(x.status||'Pending')}</span></td><td>${x.is_finalist?'🏆 Yes':'No'}</td><td>${x.public_votes||0}</td><td><button class="btn purple" onclick="details('${esc(x.registration_id)}')">View</button><button class="btn green" onclick="setStatus('${esc(x.registration_id)}','Approved')">Approve</button><button class="btn orange" onclick="setStatus('${esc(x.registration_id)}','Shortlisted')">Shortlist</button><button class="btn dark" onclick="setStatus('${esc(x.registration_id)}','Finalist')">Finalist</button></td></tr>`).join('')||'<tr><td colspan="9">No records found.</td></tr>'}</tbody></table></div></div>`}
function details(id){const x=rows.find(r=>r.registration_id===id);if(!x)return;modalbox.innerHTML=`<h2>Registration ${esc(x.registration_id)}</h2><div class="detailgrid">${[['Name',x.name],['DOB',x.dob],['Email',x.email],['Mobile',x.mobile],['WhatsApp',x.whatsapp],['District',x.district],['Taluka',x.taluka],['Village / City',x.village],['Instagram',x.instagram],['YouTube',x.youtube],['Category',x.category],['Reel Title',x.title],['Status',x.status],['Public Votes',x.public_votes||0]].map(a=>`<div class="detail"><b>${esc(a[0])}</b><br>${esc(a[1]||'-')}</div>`).join('')}</div><p><b>Reel URL:</b> ${x.reel_url?`<a target="_blank" href="${esc(x.reel_url)}">Open Reel</a>`:'-'}</p><hr><button class="btn green" onclick="setStatus('${esc(x.registration_id)}','Approved');closeModal()">Approve</button><button class="btn orange" onclick="setStatus('${esc(x.registration_id)}','Shortlisted');closeModal()">Shortlist</button><button class="btn dark" onclick="setStatus('${esc(x.registration_id)}','Finalist');closeModal()">Finalist</button><button class="btn red" onclick="setStatus('${esc(x.registration_id)}','Rejected');closeModal()">Reject</button> <button class="btn" onclick="closeModal()">Close</button>`;modal.classList.add('show')}
async function setStatus(id,status){const {error}=await sb.from('entries').update({status,is_finalist:status==='Finalist'}).eq('registration_id',id);if(error){alert(error.message);return}await load()}
function closeModal(){modal.classList.remove('show')}
async function logout(){await sb.auth.signOut();location.href='./#'}
init();
</script>
</body>
</html>
