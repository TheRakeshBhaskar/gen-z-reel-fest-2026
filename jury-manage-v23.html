<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>Jury Management V23 - GEN Z REEL FEST 2026</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.red{background:#d92d20}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.table{overflow:auto}.table table{width:100%;min-width:850px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}.btn{width:100%;margin:4px 0}.hero{border-radius:12px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap" id="app"><div class="card"><h2>Loading Jury Management...</h2></div></main><script>(function(){'use strict';const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const app=document.getElementById('app');let sb=null,judges=[],editing=null;const esc=x=>String(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));function fail(m){app.innerHTML='<div class="card err"><h2>⚠️ Jury page error</h2><p>'+esc(m)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login</h2><p class="muted">Use your authorized Admin email.</p><input id="loginEmail" type="email" placeholder="Admin email"><br><br><button id="sendBtn" class="btn">SEND LOGIN LINK</button><div id="loginMsg"></div></div>';document.getElementById('sendBtn').onclick=send}async function send(){const e=document.getElementById('loginEmail').value.trim(),m=document.getElementById('loginMsg');if(!e)return m.innerHTML='<div class="err">Enter email.</div>';const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});m.innerHTML=r.error?'<div class="err">'+esc(r.error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function init(){try{sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const s=await sb.auth.getSession();if(s.error)throw s.error;const u=s.data.session?.user;if(!u)return login();const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(p.data?.role!=='admin'){app.innerHTML='<div class="card err"><h2>🔒 Admin only</h2><p>Only an Admin can manage Jury accounts.</p><button class="btn dark" id="lo">LOGOUT</button></div>';document.getElementById('lo').onclick=logout;return}render();await load()}catch(e){fail(e?.message||String(e))}}function render(){app.innerHTML='<section class="hero"><h1>👨‍⚖️ Jury Management V23</h1><p>GEN Z REEL FEST 2026</p><span class="badge">ADMIN ONLY</span></section><div class="card"><h2 id="formTitle">➕ Add New Jury</h2><p class="muted">Enter Jury name, email and mobile number. A login link will be sent to the email.</p><div class="grid"><div class="field"><label>Jury Name *</label><input id="name" placeholder="Full name"></div><div class="field"><label>Email *</label><input id="email" type="email" placeholder="jury@example.com"></div><div class="field"><label>Mobile Number</label><input id="phone" type="tel" placeholder="9876543210"></div></div><br><label>Role</label><br><select id="role" style="max-width:300px"><option value="judge">Judge</option><option value="manager">Manager</option></select><br><br><button id="save" class="btn">ADD JURY & SEND LOGIN LINK</button><button id="cancel" class="btn dark" style="display:none">CANCEL EDIT</button><div id="msg"></div></div><div class="card"><h2>👨‍⚖️ Jury Accounts</h2><div id="list">Loading...</div></div><div class="card"><button class="btn dark" id="back">← BACK TO ADMIN</button><button class="btn dark" id="logout">LOGOUT</button></div>';document.getElementById('save').onclick=save;document.getElementById('cancel').onclick=reset;document.getElementById('back').onclick=()=>location.href='admin-v31.html?v=31';document.getElementById('logout').onclick=logout}async function load(){const r=await sb.from('profiles').select('id,full_name,email,phone,role,status,created_at').in('role',['judge','manager']).order('created_at',{ascending:true});if(r.error)throw r.error;judges=r.data||[];renderList()}function renderList(){const el=document.getElementById('list');if(!judges.length){el.innerHTML='<p class="muted">No Jury accounts found.</p>';return}el.innerHTML='<div class="table"><table><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th>Actions</th></tr>'+judges.map(j=>'<tr><td><b>'+esc(j.full_name||'Not set')+'</b></td><td>'+esc(j.email||'')+'</td><td>'+esc(j.phone||'Not set')+'</td><td>'+esc(j.role)+'</td><td>'+esc(j.status||'active')+'</td><td><button class="btn" data-edit="'+esc(j.id)+'">EDIT</button><button class="btn red" data-del="'+esc(j.id)+'">DELETE</button></td></tr>').join('')+'</table></div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeJudge(b.dataset.del))}function edit(id){const j=judges.find(x=>x.id===id);if(!j)return;editing=id;document.getElementById('formTitle').textContent='✏️ Edit Jury';document.getElementById('name').value=j.full_name||'';document.getElementById('email').value=j.email||'';document.getElementById('email').disabled=true;document.getElementById('phone').value=j.phone||'';document.getElementById('role').value=j.role;document.getElementById('save').textContent='SAVE CHANGES';document.getElementById('cancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}function reset(){editing=null;document.getElementById('formTitle').textContent='➕ Add New Jury';document.getElementById('name').value='';document.getElementById('email').value='';document.getElementById('email').disabled=false;document.getElementById('phone').value='';document.getElementById('role').value='judge';document.getElementById('save').textContent='ADD JURY & SEND LOGIN LINK';document.getElementById('cancel').style.display='none';document.getElementById('msg').innerHTML=''}async function save(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),phone=document.getElementById('phone').value.trim(),role=document.getElementById('role').value,m=document.getElementById('msg');if(!name||!email)return m.innerHTML='<div class="err">Name and email are required.</div>';if(editing){const r=await sb.from('profiles').update({full_name:name,phone,role}).eq('id',editing);if(r.error)return m.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';reset();await load();return}const existing=await sb.from('profiles').select('id').eq('email',email).maybeSingle();if(existing.error)return m.innerHTML='<div class="err">'+esc(existing.error.message)+'</div>';if(existing.data){const r=await sb.from('profiles').update({full_name:name,phone,role}).eq('id',existing.data.id);if(r.error)return m.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';m.innerHTML='<div class="ok">Existing Jury account updated.</div>';reset();await load();return}const inv=await sb.from('jury_invites').upsert({email,full_name:name,phone,role,created_by:(await sb.auth.getUser()).data.user.id},{onConflict:'email'});if(inv.error)return m.innerHTML='<div class="err">Invite setup failed: '+esc(inv.error.message)+'</div>';const otp=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+'/jury-v19.html'}});if(otp.error)return m.innerHTML='<div class="err">Login link could not be sent: '+esc(otp.error.message)+'</div>';m.innerHTML='<div class="ok"><b>Jury added.</b> Login link sent to '+esc(email)+'.</div>';reset();await load()}async function removeJudge(id){const j=judges.find(x=>x.id===id);if(!j)return;if(!confirm('Remove '+(j.full_name||j.email)+' from Jury? Existing scores will remain safe.'))return;const r=await sb.from('profiles').update({role:'participant'}).eq('id',id);if(r.error)return alert(r.error.message);await load()}async function logout(){if(sb)await sb.auth.signOut();login()}init()})();</script></body></html>
