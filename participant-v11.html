<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>My Result - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:900px;margin:auto;padding:14px 12px 50px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.hero{text-align:center;background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:14px;min-width:0}.num{font-size:25px;font-weight:800;overflow-wrap:anywhere}.rank{font-size:32px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff;text-decoration:none;margin:4px 2px;min-height:44px;box-sizing:border-box}.dark{background:#111827}.green{background:#067647}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px}.muted{color:#667085}input{padding:12px;border:1px solid #d0d5dd;border-radius:9px;width:100%;box-sizing:border-box;font-size:16px}@media(max-width:520px){.wrap{padding:8px 10px 40px}.card{padding:15px}.grid{grid-template-columns:1fr 1fr}.num{font-size:22px}.rank{font-size:28px}.btn{width:100%;margin:4px 0}.hero h1{font-size:32px}.badge{max-width:100%;overflow-wrap:anywhere}}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const root=()=>location.href.split('/').slice(0,-1).join('/');async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();showLoading();const{data:entry,error}=await sb.from('entries').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)return errorBox(error.message);if(!entry)return errorBox('No registration was found for this account. Please use the same email used during registration.');const{data:result,error:re}=await sb.from('results').select('*').eq('registration_id',entry.registration_id).maybeSingle();if(re)return errorBox(re.message);showResult(entry,result)}function login(){app.innerHTML='<div class="card hero"><h1>🏆 My Result</h1><p>GEN Z REEL FEST 2026</p></div><div class="card"><h2>Participant Login</h2><p class="muted">Use the same email you used during registration.</p><input id="email" type="email" placeholder="Your registered email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e){msg.innerHTML='<div class="err">Please enter your email.</div>';return}const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:root()+'/participant-v11.html'}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email, then return here.</div>'}function showLoading(){app.innerHTML='<div class="card"><h2>Loading your result...</h2></div>'}function errorBox(m){app.innerHTML='<div class="card err"><h2>Unable to load result</h2><p>'+esc(m)+'</p><button class="btn" onclick="login()">BACK TO LOGIN</button></div>'}function showResult(e,r){const award=r?.award||'Participant';const rank=r?.rank??'-';const final=e.final_score??r?.final_score??null;const hasCertificate=!!r&&(['Winner','1st Runner Up','2nd Runner Up'].includes(award)||String(award).toLowerCase().includes('winner'));const cert=root()+'/certificate-v12.html';const verify=root()+'/verify-v12.html';app.innerHTML='<div class="card hero"><h1>🏆 My Result</h1><p>GEN Z REEL FEST 2026</p><p><span class="badge">'+esc(award)+'</span></p></div><div class="card"><h2>'+esc(e.name)+'</h2><p><b>'+esc(e.title)+'</b></p><p>'+esc(e.district||'')+' • '+esc(e.category||'')+'</p><span class="badge">Registration ID: '+esc(e.registration_id)+'</span></div><div class="grid"><div class="stat"><b>Jury Score</b><div class="num">'+(e.jury_total??'-')+'/100</div></div><div class="stat"><b>Public Votes</b><div class="num">'+(e.public_votes??0)+'</div></div><div class="stat"><b>Final Score</b><div class="num">'+(final!=null?Number(final).toFixed(2):'-')+'/100</div></div><div class="stat"><b>Final Rank</b><div class="rank">'+esc(rank)+'</div></div></div><div class="card"><h2>🎖️ Result Status</h2><p><b>'+esc(award)+'</b></p><p class="muted">'+(r?'Your official result has been published.':'Your official result has not been published yet.')+'</p>'+(hasCertificate?'<a class="btn green" href="'+cert+'">🎖️ DOWNLOAD CERTIFICATE</a><a class="btn dark" href="'+verify+'">🔎 VERIFY CERTIFICATE</a>':'<p class="muted">Certificate will be available after an eligible official award is published.</p>')+'<br><button class="btn dark" onclick="logout()">LOGOUT</button></div>'}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
