<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Admin V13 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f8f9fc;padding:14px;border-radius:12px}.num{font-size:28px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;background:#7c3aed;color:#fff;cursor:pointer}.dark{background:#111827}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef3f2;padding:12px;border-radius:9px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}input{padding:10px;border:1px solid #d0d5dd;border-radius:9px;width:100%;box-sizing:border-box}.muted{color:#667085}</style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let rows=[];async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||p.role!=='admin')return app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin access required.</p></div>';dashboard()}function login(){app.innerHTML='<div class="card"><h2>🔐 Certificate Admin</h2><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent.</div>'}async function dashboard(){app.innerHTML='<div class="card"><h1>🎖️ Certificate Control V13</h1><p class="muted">Manage official published award records and certificate access.</p></div><div class="card"><div id="stats"></div></div><div class="card"><input id="q" placeholder="Search registration, participant or award..." oninput="render()"></div><div class="card"><div id="table"></div></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';await load()}async function load(){const{data,error}=await sb.from('results').select('*').order('rank',{ascending:true});if(error)return app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';rows=data||[];render()}function render(){const q=(document.getElementById('q')?.value||'').toLowerCase();const a=rows.filter(r=>[r.registration_id,r.name,r.award].join(' ').toLowerCase().includes(q));stats.innerHTML='<div class="grid"><div class="stat"><b>Published Results</b><div class="num">'+rows.length+'</div></div><div class="stat"><b>Winners</b><div class="num">'+rows.filter(r=>String(r.award||'').toLowerCase().includes('winner')).length+'</div></div><div class="stat"><b>Top 3</b><div class="num">'+rows.filter(r=>Number(r.rank)<=3).length+'</div></div></div>';table.innerHTML=a.length?'<div class="table"><table><tr><th>Rank</th><th>Participant</th><th>Registration</th><th>Award</th><th>Final Score</th><th>Certificate</th></tr>'+a.map(r=>'<tr><td><b>#'+esc(r.rank)+'</b></td><td>'+esc(r.name)+'</td><td>'+esc(r.registration_id)+'</td><td><span class="badge">'+esc(r.award||'Achievement')+'</span></td><td>'+esc(r.final_score)+'/100</td><td><a class="btn" href="certificate-v12.html" target="_blank">OPEN</a></td></tr>').join('')+'</table></div>':'<p class="muted">No published results found.</p>'}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
