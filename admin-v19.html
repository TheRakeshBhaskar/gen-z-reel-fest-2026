<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#312e81">
<title>Admin & Jury V19 - GEN Z REEL FEST 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1250px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.hero h1{margin:5px 0;font-size:clamp(28px,6vw,48px)}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:13px}.num{font-size:27px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.gold{background:#f59e0b;color:#111}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 180px 150px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:1150px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.table th{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.03em}.top{background:#fffbeb}.rank{font-size:20px;font-weight:900}.score{font-size:18px;font-weight:900}.small{font-size:12px;color:#667085}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.hero{border-radius:12px}.btn{width:100%;margin:4px 0}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="wrap" id="app"><div class="card"><h2>Loading Admin & Jury...</h2><p class="muted">Please wait.</p></div></main>
<script>
(function(){
'use strict';
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};
const app=document.getElementById('app');
let sb=null,role='',entries=[],scores=[];
const esc=x=>String(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
function fail(message){app.innerHTML='<div class="card err"><h2>⚠️ Admin page error</h2><p>'+esc(message)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>';}
function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin / Jury Login</h2><p class="muted">Use your authorized account email.</p><input id="loginEmail" type="email" placeholder="Authorized email"><br><br><button id="sendBtn" class="btn">SEND LOGIN LINK</button><div id="loginMsg"></div></div>';document.getElementById('sendBtn').onclick=send;}
async function send(){const input=document.getElementById('loginEmail'),msg=document.getElementById('loginMsg'),e=input.value.trim();if(!e){msg.innerHTML='<div class="err">Please enter your email.</div>';return}const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>';}
async function init(){try{if(!window.supabase?.createClient)throw new Error('Supabase JavaScript library did not load. Please refresh the page.');sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const sessionResult=await sb.auth.getSession();if(sessionResult.error)throw sessionResult.error;const user=sessionResult.data.session?.user||null;if(!user){login();return}const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||!['admin','manager','judge'].includes(p.data.role)){app.innerHTML='<div class="card err"><h2>🔒 Access denied</h2><p>Admin, Manager or Judge access is required.</p><button class="btn dark" id="backBtn">LOGOUT</button></div>';document.getElementById('backBtn').onclick=logout;return}role=p.data.role;dashboard(user.email||'');}catch(err){fail(err?.message||String(err));}}
function dashboard(email){app.innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>V19 Jury Scores & Final Ranking</p><span class="badge">ROLE: '+esc(role.toUpperCase())+'</span></section><div class="card"><p><b>Signed in:</b> '+esc(email)+'</p><div class="grid" id="stats"></div></div><div class="card"><h2>🏆 Final Ranking</h2><p class="muted">Primary ranking is the average Jury Score out of 100. Public votes are shown separately and used only as the tie-breaker.</p><div class="filters"><input id="q" placeholder="Search registration, name, reel, district"><select id="scope"><option value="finalists">Finalists only</option><option value="all">All entries</option></select><select id="minJudges"><option value="0">Any number of judges</option><option value="1">At least 1 judge</option><option value="2">At least 2 judges</option><option value="3">At least 3 judges</option></select></div></div><div class="card"><div id="table"></div></div><div id="adminControls" class="card '+(role==='admin'?'':'hidden')+'"><h2>👑 Admin Controls</h2><p class="muted">Only Admin can publish official results.</p><button id="publishBtn" class="btn gold">PUBLISH TOP 3</button><button id="resultsBtn" class="btn dark">VIEW OFFICIAL RESULTS</button></div><div class="card"><button id="logoutBtn" class="btn dark">LOGOUT</button></div>';document.getElementById('q').oninput=render;document.getElementById('scope').onchange=render;document.getElementById('minJudges').onchange=render;document.getElementById('logoutBtn').onclick=logout;if(role==='admin'){document.getElementById('publishBtn').onclick=publishTop3;document.getElementById('resultsBtn').onclick=()=>location.href='results-v10.html';}load();}
async function load(){try{const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(a.error)throw a.error;entries=a.data||[];const j=await sb.from('jury_scores').select('entry_id,judge_id,creativity,content,performance,editing,local_connect,total').order('created_at',{ascending:true});if(j.error)throw j.error;scores=j.data||[];render();}catch(err){fail(err?.message||String(err));}}
function calc(){const by={};scores.forEach(s=>{if(!by[s.entry_id])by[s.entry_id]=[];const total=Number(s.total);if(Number.isFinite(total))by[s.entry_id].push({judge_id:s.judge_id,total,creativity:Number(s.creativity)||0,content:Number(s.content)||0,performance:Number(s.performance)||0,editing:Number(s.editing)||0,local_connect:Number(s.local_connect)||0});});return entries.filter(e=>by[e.id]?.length).map(e=>{const list=by[e.id];const avg=list.reduce((a,b)=>a+b.total,0)/list.length;return {...e,judgeRows:list,judges:list.length,jury:avg};}).sort((a,b)=>b.jury-a.jury||Number(b.public_votes||0)-Number(a.public_votes||0)||String(a.registration_id).localeCompare(String(b.registration_id)));}
function render(){const ranked=calc(),q=(document.getElementById('q')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'finalists',minJudges=Number(document.getElementById('minJudges')?.value||0),rows=ranked.filter(e=>(scope==='all'||e.is_finalist)&&e.judges>=minJudges&&[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase().includes(q));const finalistRanked=ranked.filter(e=>e.is_finalist);document.getElementById('stats').innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+entries.filter(e=>e.is_finalist).length+'</div></div><div class="stat"><b>Scored Entries</b><div class="num">'+ranked.length+'</div></div><div class="stat"><b>Scored Finalists</b><div class="num">'+finalistRanked.length+'</div></div><div class="stat"><b>Total Jury Scores</b><div class="num">'+scores.length+'</div></div>';document.getElementById('table').innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Category</th><th>Jury Average</th><th>Judges</th><th>Public Votes</th><th>Score Details</th></tr>'+rows.map((e,i)=>'<tr class="'+(e.is_finalist?'top':'')+'"><td class="rank">'+(i+1)+'</td><td><b>'+esc(e.registration_id)+'</b></td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+esc(e.category)+'</td><td class="score">'+e.jury.toFixed(2)+'/100</td><td>'+e.judges+'</td><td>'+Number(e.public_votes||0)+'</td><td><button class="btn dark detailBtn" type="button" data-entry-id="'+esc(e.id)+'">VIEW</button></td></tr>').join('')+'</table></div>':'<p class="muted">No scored entries found for the selected filters.</p>';document.querySelectorAll('.detailBtn').forEach(b=>b.onclick=()=>showDetails(b.dataset.entryId));}
function showDetails(id){const e=calc().find(x=>x.id===id);if(!e)return;let html='<div class="card"><h2>🎯 Jury Score Details</h2><p><b>'+esc(e.registration_id)+'</b> • '+esc(e.name)+' • '+esc(e.title)+'</p><p><b>Jury Average:</b> '+e.jury.toFixed(2)+'/100 &nbsp; <b>Judges:</b> '+e.judges+'</p><div class="table"><table><tr><th>Judge ID</th><th>Creativity</th><th>Content</th><th>Editing</th><th>Presentation</th><th>Local Connect</th><th>Total</th></tr>'+e.judgeRows.map(s=>'<tr><td class="small">'+esc(s.judge_id)+'</td><td>'+s.creativity+'</td><td>'+s.content+'</td><td>'+s.editing+'</td><td>'+s.performance+'</td><td>'+s.local_connect+'</td><td><b>'+s.total+'/100</b></td></tr>').join('')+'</table></div><br><button class="btn dark" id="closeDetails">CLOSE</button></div>';const old=document.getElementById('detailsModal');if(old)old.remove();const d=document.createElement('div');d.id='detailsModal';d.innerHTML=html;document.getElementById('table').parentElement.insertAdjacentElement('afterend',d);document.getElementById('closeDetails').onclick=()=>d.remove();}
async function publishTop3(){if(role!=='admin')return alert('Admin only.');const rows=calc().filter(e=>e.is_finalist).slice(0,3);if(rows.length<3)return alert('At least 3 scored finalists are required.');const payload=rows.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'}));const ins=await sb.from('results').upsert(payload,{onConflict:'registration_id'});if(ins.error)return alert(ins.error.message);alert('Top 3 published successfully.');location.href='results-v10.html';}
async function logout(){if(sb)await sb.auth.signOut();login();}
window.addEventListener('error',e=>{if(!document.querySelector('.err'))fail(e.message||'Unexpected JavaScript error.');});window.addEventListener('unhandledrejection',e=>{if(!document.querySelector('.err'))fail(e.reason?.message||String(e.reason||'Unexpected error.'));});init();
})();
</script>
</body>
</html>
