<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>Manage Jury V20 - GEN Z REEL FEST 2026</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1050px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.red{background:#d92d20}.gold{background:#f59e0b;color:#111}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.table{overflow:auto}.table table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.btn{width:100%;margin:4px 0}.hero{border-radius:12px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap" id="app"><div class="card">Loading...</div></main><script>(function(){'use strict';const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const app=document.getElementById('app');let sb,user,judges=[];const esc=x=>String(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));function fail(m){app.innerHTML='<div class="card err"><h2>⚠️ Error</h2><p>'+esc(m)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}async function init(){try{sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const s=await sb.auth.getSession();user=s.data.session?.user;if(!user)return login();const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(p.data?.role!=='admin'){app.innerHTML='<div class="card err"><h2>🔒 Admin only</h2><p>Only an Admin can add, edit or delete jury accounts.</p><button class="btn dark" onclick="logout()">LOGOUT</button></div>';return}render();await load()}catch(e){fail(e.message||String(e))}}function login(){app.innerHTML='<div class="card"><h2>🔐 Admin Login</h2><p class="muted">Use your authorized Admin email.</p><input id="email" class="field" type="email" placeholder="Admin email"><br><button class="btn" onclick="sendLogin()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function sendLogin(){const e=document.getElementById('email').value.trim(),m=document.getElementById('msg');if(!e)return m.innerHTML='<div class="err">Enter email.</div>';const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});m.innerHTML=r.error?'<div class="err">'+esc(r.error.message)+'</div>':'<div class="ok">Login link sent.</div>'}function render(){app.innerHTML='<section class="hero"><h1>👨‍⚖️ Jury Management</h1><p>GEN Z REEL FEST 2026</p><span class="badge">ADMIN ONLY</span></section><div class="card"><h2 id="formTitle">➕ Add Jury</h2><div class="grid"><div class="field"><label>Judge Name</label><input id="name" placeholder="Full name"></div><div class="field"><label>Email</label><input id="jemail" type="email" placeholder="judge@example.com"></div><div class="field"><label>Role</label><select id="role"><option value="judge">Judge</option><option value="manager">Manager</option></select></div><div class="field"><label>Status</label><select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div><br><button id="save" class="btn">ADD JURY</button><button id="cancel" class="btn dark" style="display:none">CANCEL EDIT</button><div id="formMsg"></div></div><div class="card"><h2>👨‍⚖️ Jury Accounts</h2><div id="list">Loading...</div></div><div class="card"><button class="btn dark" onclick="location.href='admin-v19.html'">← BACK TO ADMIN RANKING</button><button class="btn dark" onclick="logout()">LOGOUT</button></div>' ;document.getElementById('save').onclick=save;document.getElementById('cancel').onclick=resetForm}async function load(){const r=await sb.from('profiles').select('id,full_name,email,role,status,created_at').in('role',['judge','manager']).order('created_at',{ascending:true});if(r.error)return fail(r.error.message);judges=r.data||[];renderList()}function renderList(){const el=document.getElementById('list');if(!judges.length){el.innerHTML='<p class="muted">No jury accounts found.</p>';return}el.innerHTML='<div class="table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>'+judges.map(j=>'<tr><td><b>'+esc(j.full_name||'')+'</b></td><td>'+esc(j.email||'')+'</td><td>'+esc(j.role)+'</td><td>'+esc(j.status||'active')+'</td><td><button class="btn" data-edit="'+esc(j.id)+'">EDIT</button><button class="btn red" data-del="'+esc(j.id)+'">DELETE</button></td></tr>').join('')+'</table></div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeJudge(b.dataset.del))}let editing=null;function edit(id){const j=judges.find(x=>x.id===id);if(!j)return;editing=id;document.getElementById('formTitle').textContent='✏️ Edit Jury';document.getElementById('name').value=j.full_name||'';document.getElementById('jemail').value=j.email||'';document.getElementById('jemail').disabled=true;document.getElementById('role').value=j.role;document.getElementById('status').value=j.status||'active';document.getElementById('save').textContent='SAVE CHANGES';document.getElementById('cancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}function resetForm(){editing=null;document.getElementById('formTitle').textContent='➕ Add Jury';document.getElementById('name').value='';document.getElementById('jemail').value='';document.getElementById('jemail').disabled=false;document.getElementById('role').value='judge';document.getElementById('status').value='active';document.getElementById('save').textContent='ADD JURY';document.getElementById('cancel').style.display='none';document.getElementById('formMsg').innerHTML=''}async function save(){const name=document.getElementById('name').value.trim(),email=document.getElementById('jemail').value.trim().toLowerCase(),role=document.getElementById('role').value,status=document.getElementById('status').value,msg=document.getElementById('formMsg');if(!name||!email)return msg.innerHTML='<div class="err">Name and email are required.</div>';if(editing){const r=await sb.from('profiles').update({full_name:name,role,status}).eq('id',editing);if(r.error)return msg.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';msg.innerHTML='<div class="ok">Jury updated successfully.</div>';resetForm();await load();return}const existing=await sb.from('profiles').select('id').eq('email',email).maybeSingle();if(existing.error)return msg.innerHTML='<div class="err">'+esc(existing.error.message)+'</div>';if(existing.data)return msg.innerHTML='<div class="err">This email already has a profile.</div>';const auth=await sb.auth.admin.createUser({email,email_confirm:true});if(auth.error)return msg.innerHTML='<div class="err">'+esc(auth.error.message)+'</div>';const id=auth.data.user.id;const r=await sb.from('profiles').insert({id,full_name:name,email,role,status});if(r.error)return msg.innerHTML='<div class="err">Profile creation failed: '+esc(r.error.message)+'</div>';msg.innerHTML='<div class="ok">Jury account created. They can login with a magic link.</div>';resetForm();await load()}async function removeJudge(id){const j=judges.find(x=>x.id===id);if(!j)return;if(!confirm('Delete '+(j.full_name||j.email)+'? This will remove the jury profile but does not delete their scores.'))return;const r=await sb.from('profiles').delete().eq('id',id);if(r.error)return alert(r.error.message);await load()}async function logout(){await sb.auth.signOut();login()}init()})();</script></body></html>
