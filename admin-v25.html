<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V25 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1350px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:13px}.num{font-size:27px;font-weight:900}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.green{background:#12b76a}.red{background:#d92d20}.gold{background:#f59e0b;color:#111}.blue{background:#2563eb}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.warn{background:#fffaeb;padding:12px;border-radius:9px;color:#92400e}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 180px 150px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:1450px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.top{background:#fffbeb}.rank{font-size:20px;font-weight:900}.score{font-size:18px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}.complete{color:#067647;font-weight:900}.pending{color:#b54708;font-weight:900}.judge-status{font-size:12px;margin-top:4px;line-height:1.4}.scored{color:#067647}.waiting{color:#b54708}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.btn{width:100%}}</style></head><body><main class="wrap" id="app"><div class="card">Loading...</div></main><script>(function(){'use strict';const C={url:'https://tewprfdirrhpaowvqyhj.supabase.co',key:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'},app=document.getElementById('app');let sb=null,role='',entries=[],scores=[],profiles={},judges=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function fail(x){app.innerHTML='<div class="card err"><h2>⚠️ Admin page error</h2><p>'+esc(x)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login</h2><input id="em" type="email" placeholder="Admin email"><br><br><button class="btn" id="send">SEND LOGIN LINK</button><div id="msg"></div></div>';document.getElementById('send').onclick=async()=>{const e=document.getElementById('em').value.trim(),m=document.getElementById('msg');if(!e)return;m.textContent='Sending...';const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});m.innerHTML=r.error?'<div class="err">'+esc(r.error.message)+'</div>':'<div class="ok">Login link sent.</div>'}}async function init(){try{sb=window.supabase.createClient(C.url,C.key);const s=await sb.auth.getSession(),u=s.data?.session?.user;if(!u)return login();const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(!['admin','manager'].includes(p.data?.role))return fail('Admin or Manager access is required.');role=p.data.role;renderShell(u.email||'');await load()}catch(e){fail(e.message||String(e))}}function renderShell(email){app.innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Admin • Finalists • Jury Scores • Final Ranking</p><span class="badge">'+esc(role.toUpperCase())+'</span></section><div class="card"><p><b>Signed in:</b> '+esc(email)+'</p><div class="grid" id="stats"></div></div><div class="card"><h2>⚖️ Jury Scoring Rule</h2><div class="warn"><b>Registered Judges:</b> <b id="judgeCount">0</b><br>प्रत्येक Finalist साठी registered Judges इतकेच valid scores धरले जातील. Extra score असल्यास <b>सर्वात जास्त score असलेला extra score remove</b> केला जाईल.</div><div id="completion" style="margin-top:10px"></div></div><div class="card"><h2>Entries & Finalists</h2><p class="muted">New participant → MAKE FINALIST → SCORE. Final Ranking मध्ये फक्त fully scored finalists ला valid rank मिळेल.</p><div class="filters"><input id="q" placeholder="Search registration, name, reel, district"><select id="scope"><option value="all">All Entries</option><option value="finalists">Finalists only</option><option value="scored">Scored only</option></select><select id="min"><option value="0">Any judges</option><option value="1">At least 1 judge</option><option value="2">At least 2 judges</option><option value="3">At least 3 judges</option></select></div></div><div class="card"><div id="table"></div></div><div class="card"><button class="btn gold" id="pub">PUBLISH TOP 3</button><button class="btn dark" id="results">VIEW OFFICIAL RESULTS</button><button class="btn dark" id="jury">JURY MANAGEMENT</button><button class="btn dark" id="logout">LOGOUT</button></div>';q.oninput=render;scope.onchange=render;min.onchange=render;document.getElementById('pub').onclick=publish;document.getElementById('results').onclick=()=>location.href='results-v10.html';document.getElementById('jury').onclick=()=>location.href='jury-manage-v23.html';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()}}async function cleanupScores(){const active=new Set(judges.map(j=>j.id)),by={};scores.forEach(s=>(by[s.entry_id]??=[]).push(s));let remove=[];Object.values(by).forEach(list=>{remove.push(...list.filter(s=>!active.has(s.judge_id)));const valid=list.filter(s=>active.has(s.judge_id));if(valid.length>judges.length){valid.sort((a,b)=>Number(b.total||0)-Number(a.total||0));remove.push(...valid.slice(0,valid.length-judges.length))}});const ids=remove.map(x=>x.id).filter(Boolean);if(ids.length){const r=await sb.from('jury_scores').delete().in('id',ids);if(r.error)throw r.error}}async function load(){const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(a.error)throw a.error;entries=a.data||[];const j=await sb.from('jury_scores').select('id,entry_id,judge_id,creativity,content,performance,editing,local_connect,total,created_at').order('created_at',{ascending:true});if(j.error)throw j.error;scores=j.data||[];const p=await sb.from('profiles').select('id,full_name,email,role');if(p.error)throw p.error;profiles={};(p.data||[]).forEach(x=>profiles[x.id]=x);judges=(p.data||[]).filter(x=>x.role==='judge');await cleanupScores();const fresh=await sb.from('jury_scores').select('id,entry_id,judge_id,creativity,content,performance,editing,local_connect,total,created_at').order('created_at',{ascending:true});if(fresh.error)throw fresh.error;scores=fresh.data||[];render()}function calc(){const m={};scores.forEach(s=>(m[s.entry_id]??=[]).push(s));return entries.map(e=>{const list=(m[e.id]||[]).filter(s=>judges.some(j=>j.id===s.judge_id)),unique=new Set(list.map(s=>s.judge_id)),avg=list.length?list.reduce((a,s)=>a+Number(s.total||0),0)/list.length:0,complete=e.is_finalist&&judges.length>0&&list.length===judges.length&&judges.every(j=>unique.has(j.id)),pendingJudges=judges.filter(j=>!unique.has(j.id));return {...e,rows:list,judges:unique.size,jury:avg,complete,pendingJudges}})}function ranking(){return calc().filter(e=>e.is_finalist&&e.complete).sort((a,b)=>b.jury-a.jury||Number(b.public_votes||0)-Number(a.public_votes||0))}function render(){const all=calc(),ranked=ranking(),rankMap={};ranked.forEach((e,i)=>rankMap[e.id]=i+1);const qv=(document.getElementById('q')?.value||'').toLowerCase(),sc=document.getElementById('scope')?.value||'all',mn=Number(document.getElementById('min')?.value||0),rows=all.filter(e=>{if(sc==='finalists'&&!e.is_finalist)return false;if(sc==='scored'&&!e.judges)return false;if(e.judges<mn)return false;return[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase().includes(qv)}),finalists=all.filter(e=>e.is_finalist),incomplete=finalists.filter(e=>!e.complete);stats.innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+finalists.length+'</div></div><div class="stat"><b>Valid Ranked</b><div class="num">'+ranked.length+'</div></div><div class="stat"><b>Pending</b><div class="num">'+incomplete.length+'</div></div><div class="stat"><b>Total Jury Scores</b><div class="num">'+scores.length+'</div></div>';judgeCount.textContent=judges.length;completion.innerHTML=finalists.length?(incomplete.length?'<div class="warn"><b>Pending:</b> '+incomplete.map(e=>esc(e.name)+' ('+e.judges+'/'+judges.length+')'+(e.pendingJudges.length?' — '+e.pendingJudges.map(j=>esc(j.full_name||j.email||'Judge')).join(', '):'')).join('<br>')+'. Rank will appear after all registered Judges score.</div>':'<div class="ok"><b>All finalists are fully scored.</b> Final Ranking is valid.</div>'):'<div class="muted">No finalists yet.</div>';table.innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Finalist</th><th>Jury Average</th><th>Judges</th><th>Completion / Pending Judge</th><th>Public Votes</th><th>Action</th></tr>'+rows.map(e=>'<tr class="'+(e.is_finalist?'top':'')+'"><td class="rank">'+(rankMap[e.id]||'—')+'</td><td><b>'+esc(e.registration_id)+'</b></td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+(e.is_finalist?'✅ FINALIST':'—')+'</td><td class="score">'+(e.judges?e.jury.toFixed(2)+'/100':'—')+'</td><td>'+e.judges+'/'+judges.length+'</td><td class="'+(e.complete?'complete':'pending')+'">'+(e.is_finalist?(e.judges+'/'+judges.length+(e.complete?' ✅':' ⏳')+(e.pendingJudges.length?'<div class="judge-status waiting">Pending: '+e.pendingJudges.map(j=>esc(j.full_name||j.email||'Judge')).join(', ')+'</div>':'<div class="judge-status scored">All registered judges scored</div>')):'—')+'</td><td>'+Number(e.public_votes||0)+'</td><td>'+((role==='admin')?(e.is_finalist?'<button class="btn red toggle" data-id="'+e.id+'">REMOVE FINALIST</button>':'<button class="btn green toggle" data-id="'+e.id+'">MAKE FINALIST</button>'):'')+(e.is_finalist?'<button class="btn blue scoreBtn" data-id="'+e.id+'">🎯 SCORE</button>':'')+(e.judges?'<button class="btn dark detail" data-id="'+e.id+'">VIEW SCORES</button>':'')+'</td></tr>').join('')+'</table></div>':'<p class="muted">No entries found.</p>';document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggleFinalist(b.dataset.id));document.querySelectorAll('.scoreBtn').forEach(b=>b.onclick=()=>location.href='jury-v19.html?entry='+encodeURIComponent(b.dataset.id));document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>details(b.dataset.id))}async function toggleFinalist(id){if(role!=='admin')return;const e=entries.find(x=>x.id===id);if(!e||!confirm((e.is_finalist?'Remove ':'Make ')+e.name+(e.is_finalist?' from Finalists?':' a Finalist?')))return;const r=await sb.from('entries').update({is_finalist:!e.is_finalist,status:!e.is_finalist?'Finalist':(e.status==='Finalist'?'Submitted':e.status)}).eq('id',id);if(r.error)return alert(r.error.message);await load()}function details(id){const e=calc().find(x=>x.id===id);if(!e)return;const d=document.createElement('div');const rows=judges.map(j=>{const s=e.rows.find(x=>x.judge_id===j.id),p=profiles[j.id]||j;if(!s)return '<tr><td><b>'+esc(p.full_name||p.email||'Judge')+'</b></td><td colspan="5" class="waiting">⏳ Pending</td><td>—</td></tr>';return '<tr><td><b>'+esc(p.full_name||p.email||'Judge')+'</b></td><td>'+s.creativity+'</td><td>'+s.content+'</td><td>'+s.editing+'</td><td>'+s.performance+'</td><td>'+s.local_connect+'</td><td><b>'+s.total+'/100</b></td></tr>'}).join('');d.innerHTML='<div class="card"><h2>🎯 Jury Score Details</h2><p><b>'+esc(e.name)+'</b> • '+esc(e.title)+'</p><p><b>Valid Average:</b> '+e.jury.toFixed(2)+'/100 &nbsp; <b>Judges:</b> '+e.judges+'/'+judges.length+'</p><div class="table"><table><tr><th>Judge Name</th><th>Creativity</th><th>Content</th><th>Editing</th><th>Presentation</th><th>Local Connect</th><th>Total</th></tr>'+rows+'</table></div><button class="btn dark" onclick="this.parentElement.remove()">CLOSE</button></div>';document.getElementById('table').parentElement.insertAdjacentElement('afterend',d)}async function publish(){const rows=ranking().slice(0,3);if(judges.length===0)return alert('No registered Judges found.');if(rows.length<3)return alert('At least 3 fully scored finalists are required for valid Top 3.');const p=rows.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'})),r=await sb.from('results').upsert(p,{onConflict:'registration_id'});if(r.error)return alert(r.error.message);location.href='results-v10.html'}window.addEventListener('error',e=>fail(e.message||'Unexpected JavaScript error.'));window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||String(e.reason||'Unexpected error.')));init()})()</script></body></html>
