<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN Z REEL FEST 2026 | Certificate Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#101828}.wrap{max-width:720px;margin:60px auto;padding:20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:32px;box-shadow:0 16px 50px #10182812;text-align:center}.logo{font-size:48px}.h1{font-size:34px;font-weight:950;margin:8px 0}.sub{color:#667085}.form{display:flex;gap:10px;margin:28px 0}.form input{flex:1;padding:15px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:14px 18px;background:#7c3aed;color:#fff;font-weight:900;cursor:pointer}.result{display:none;text-align:left;border:1px solid #e4e7ec;border-radius:18px;padding:20px;margin-top:18px}.result h2{margin:0 0 8px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eaecf0}.actions{text-align:center;margin-top:15px}.error{display:none;color:#b42318;background:#fef3f2;border-radius:12px;padding:12px;font-weight:700}@media(max-width:600px){.form{flex-direction:column}.wrap{margin:20px auto}.card{padding:22px}} </style></head><body><main class="wrap"><section class="card"><div class="logo">🏆</div><div class="h1">GEN Z REEL FEST 2026</div><div class="sub">Certificate Download Center<br>Bhandara × Gondia</div><div class="form"><input id="reg" placeholder="Enter Registration ID" autocomplete="off"><button class="btn" onclick="findCert()">VIEW CERTIFICATE</button></div><div id="error" class="error">Registration ID not found. Please check and try again.</div><div id="result" class="result"><h2 id="name"></h2><div class="row"><span>Registration ID</span><b id="rid"></b></div><div class="row"><span>Award</span><b id="award"></b></div><div class="row"><span>Final Jury Score</span><b id="score"></b></div><div class="row"><span>District</span><b id="district"></b></div><div class="actions"><a id="open" class="btn" style="display:inline-block;text-decoration:none">🎓 Open Certificate</a><button class="btn" onclick="window.print()">🖨️ Print</button></div></div></section></main><script>const participants={'RB-GZR-2026-00006':{name:'Wartaa Dotcom',award:'WINNER',score:'80.00 / 100',district:'Bhandara'},'RB-GZR-2026-00007':{name:'Rakesh Bhaskar',award:'1st RUNNER UP',score:'77.50 / 100',district:'Bhandara'},'RB-GZR-2026-00008':{name:'Deepa',award:'2nd RUNNER UP',score:'64.50 / 100',district:'Gondia'}};function findCert(){const id=document.getElementById('reg').value.trim().toUpperCase();const d=participants[id];const err=document.getElementById('error');const box=document.getElementById('result');if(!d){err.style.display='block';box.style.display='none';return}err.style.display='none';box.style.display='block';document.getElementById('name').textContent=d.name;document.getElementById('rid').textContent=id;document.getElementById('award').textContent=d.award;document.getElementById('score').textContent=d.score;document.getElementById('district').textContent=d.district;document.getElementById('open').href='certificate-v27.html?reg='+encodeURIComponent(id)}document.getElementById('reg').addEventListener('keydown',e=>{if(e.key==='Enter')findCert()});</script></body></html>
