<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jury Scoring V3 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input{padding:11px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}.dark{background:#111827}.err{background:#fef2f2;padding:12px;border-radius:9px}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.score{font-size:24px;font-weight:800}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left} </style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||!['admin','manager','judge'].includes(p.role))return app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin/Jury access required.</p></div>';dashboard()}function login(){app.innerHTML='<div class="card"><h2>🔐 Jury Login</h2><input id="email" type="email" placeholder="Your email"><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e)return;const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function dashboard(){const {data,error}=await sb.from('entries').select('*').order('created_at',{ascending:false});if(error)return app.innerHTML='<div class="card err">'+esc(error.message)+'</div>';const total=data.length,finalists=data.filter(x=>x.is_finalist).length;app.innerHTML='<div class="card"><h1>🎯 Jury Scoring V3</h1><p>Score each finalist or shortlisted reel out of 100.</p><div class="grid"><div class="card"><b>Total</b><div class="score">'+total+'</div></div><div class="card"><b>Finalists</b><div class="score">'+finalists+'</div></div><div class="card"><b>Scored</b><div class="score">'+data.filter(x=>x.jury_total!=null).length+'</div></div></div></div><div class="card"><h2>Jury Entries</h2><div class="table"><table><tr><th>Registration</th><th>Name</th><th>Reel</th><th>Status</th><th>Total</th><th>Action</th></tr>'+data.map(x=>'<tr><td>'+esc(x.registration_id)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.status)+'</td><td>'+(x.jury_total??'-')+'</td><td><button class="btn" onclick="score(\''+x.registration_id+'\')">SCORE</button></td></tr>').join('')+'</table></div></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>'}async function score(id){const {data:x}=await sb.from('entries').select('*').eq('registration_id',id).single();if(!x)return;app.innerHTML='<div class="card"><h2>🎬 Score: '+esc(x.title||x.registration_id)+'</h2><p><b>'+esc(x.name)+'</b> • '+esc(x.district)+'</p><div class="grid">'+field('Creativity','creativity',x.jury_creativity)+' '+field('Content','content',x.jury_content)+' '+field('Editing','editing',x.jury_editing)+' '+field('Presentation','presentation',x.jury_presentation)+' '+field('Local Connect','local_connect',x.jury_local_connect)+'</div><br><button class="btn" onclick="save(\''+esc(id)+'\')">SAVE SCORE</button> <button class="btn dark" onclick="dashboard()">BACK</button><div id="msg"></div></div>'}function field(label,id,v){return '<div class="field"><label>'+label+' (0-20)</label><input id="'+id+'" type="number" min="0" max="20" value="'+(v??0)+'"></div>'}async function save(id){const vals=['creativity','content','editing','presentation','local_connect'].map(k=>Math.max(0,Math.min(20,Number(document.getElementById(k).value)||0)));const patch={jury_creativity:vals[0],jury_content:vals[1],jury_editing:vals[2],jury_presentation:vals[3],jury_local_connect:vals[4],jury_total:vals.reduce((a,b)=>a+b,0)};const {error}=await sb.from('entries').update(patch).eq('registration_id',id);msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Score saved. Total: '+patch.jury_total+'/100</div>';setTimeout(dashboard,700)}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
