<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Results V6 - GEN Z REEL FEST 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#101828;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #1018280a}.hero{background:linear-gradient(135deg,#141b4d,#6d28d9);color:#fff;text-align:center;padding:30px}.hero h1{font-size:38px;margin:0 0 6px}.hero p{margin:4px 0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#f8f9fc;border-radius:14px;padding:16px}.num{font-size:30px;font-weight:800;margin-top:4px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end}.place{border:1px solid #e4e7ec;border-radius:16px;padding:18px;text-align:center;background:#fff}.place.first{padding-top:28px;padding-bottom:28px;background:#fffbeb}.medal{font-size:42px}.winnerScore{font-size:28px;font-weight:900}.filters{display:grid;grid-template-columns:1fr 180px 160px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;background:#fff}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}.dark{background:#111827}.green{background:#059669}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1080px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left}.table th{font-size:13px;color:#667085;background:#fafafa}.rank{font-size:21px;font-weight:800}.top{background:#fffbeb}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2ff}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.categoryGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.category{border:1px solid #e4e7ec;border-radius:14px;padding:16px}.category h3{margin:8px 0}.note{font-size:13px;color:#667085;background:#f8f9fc;padding:12px;border-radius:10px}@media(max-width:700px){.podium{grid-template-columns:1fr}.podium .first{order:-1}.filters{grid-template-columns:1fr}.hero h1{font-size:28px}}
@media print{.noPrint{display:none!important}.card{box-shadow:none}.hero{color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let entries=[],votes=[],juryWeight=70,publicWeight=30,lastUpdated=null;
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||!['admin','manager','judge'].includes(p.role)){app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin/Jury access required.</p></div>';return}dashboard()}
function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Final Results V6</h2><p class="muted">Use your registered jury/admin email.</p><input id="email" type="email" placeholder="Your email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}
async function send(){const e=document.getElementById('email').value.trim();if(!e)return;const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});document.getElementById('msg').innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}
async function load(){const er=await sb.from('entries').select('*').order('created_at',{ascending:true});if(er.error)throw er.error;entries=er.data||[];const vr=await sb.from('votes').select('*');if(vr.error){votes=[]}else votes=vr.data||[];lastUpdated=new Date()}
function voteCount(e){let n=0;for(const v of votes){const rid=v.registration_id??v.entry_registration_id??v.registrationId;const eid=v.entry_id??v.entryid??v.candidate_id??v.entryId??v.candidateId;if(rid!=null&&String(rid)===String(e.registration_id))n++;else if(eid!=null&&String(eid)===String(e.id))n++}return n}
function compute(){const scored=entries.filter(e=>e.jury_total!=null);const maxVotes=Math.max(1,...scored.map(voteCount));return scored.map(e=>{const jury=Number(e.jury_total)||0;const vc=voteCount(e);const publicScore=(vc/maxVotes)*100;const finalScore=(jury*juryWeight/100)+(publicScore*publicWeight/100);return {...e,vote_count:vc,public_score:publicScore,final_score:finalScore}}).sort((a,b)=>b.final_score-a.final_score||b.jury_total-a.jury_total||b.vote_count-a.vote_count||String(a.created_at).localeCompare(String(b.created_at)))}
function rankMap(rows){let last=null,rank=0;const out={};rows.forEach((x,i)=>{if(x.final_score!==last){rank=i+1;last=x.final_score}out[x.id]=rank});return out}
async function dashboard(){app.innerHTML='<div class="card hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Final Result Engine V6</p><p>Jury <b>70%</b> + Public Voting <b>30%</b></p></div><div class="card"><div class="sectionTitle"><h2>📊 Result Overview</h2><span id="updated" class="muted small"></span></div><div class="grid"><div class="stat"><b>Total Entries</b><div id="total" class="num">--</div></div><div class="stat"><b>Scored Entries</b><div id="scored" class="num">--</div></div><div class="stat"><b>Finalists</b><div id="finalists" class="num">--</div></div><div class="stat"><b>Total Votes</b><div id="votes" class="num">--</div></div></div></div><div class="card"><div class="sectionTitle"><h2>🥇 Top 3</h2><span class="muted small">Final score out of 100</span></div><div id="podium" class="podium"></div></div><div class="card noPrint"><div class="sectionTitle"><h2>⚙️ Result Settings</h2><button class="btn green" onclick="refreshData()">↻ REFRESH DATA</button></div><div class="grid"><div><label>Jury Weight %</label><input id="jw" type="number" min="0" max="100" value="70"></div><div><label>Public Voting Weight %</label><input id="pw" type="number" min="0" max="100" value="30"></div></div><br><button class="btn" onclick="applyWeights()">CALCULATE FINAL RESULTS</button> <button class="btn dark" onclick="window.print()">PRINT / SAVE PDF</button><div class="note" style="margin-top:12px">Tie-break order: Final Score → Jury Score → Public Votes → Earlier registration.</div></div><div class="card noPrint"><div class="filters"><input id="search" placeholder="Search registration, name or reel..." oninput="render()"><select id="scope" onchange="render()"><option value="finalists">Finalists</option><option value="all">All scored</option></select><select id="limit" onchange="render()"><option value="10">Top 10</option><option value="25">Top 25</option><option value="50">Top 50</option><option value="all">All</option></select></div></div><div class="card"><h2>🏆 Final Ranking</h2><div id="table"></div></div><div class="card"><h2>🎖️ Category Winners</h2><div id="cats" class="categoryGrid"></div></div><div class="card noPrint"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';try{await load();render()}catch(e){app.innerHTML='<div class="card err"><h2>Could not load results</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="dashboard()">TRY AGAIN</button></div>'}}
async function refreshData(){try{await load();render()}catch(e){alert(e.message)}}
function applyWeights(){const j=Math.max(0,Math.min(100,Number(document.getElementById('jw').value)||0)),p=Math.max(0,Math.min(100,Number(document.getElementById('pw').value)||0));if(j+p!==100){alert('Jury Weight + Public Voting Weight must equal 100.');return}juryWeight=j;publicWeight=p;render()}
function render(){const rows0=compute(),ranks=rankMap(rows0),q=(document.getElementById('search')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'finalists',lim=document.getElementById('limit')?.value||'10';let rows=rows0.filter(e=>{if(scope==='finalists'&&!e.is_finalist)return false;const t=[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase();return !q||t.includes(q)});if(lim!=='all')rows=rows.slice(0,Number(lim));document.getElementById('total').textContent=entries.length;document.getElementById('scored').textContent=rows0.length;document.getElementById('finalists').textContent=entries.filter(e=>e.is_finalist).length;document.getElementById('votes').textContent=votes.length;document.getElementById('updated').textContent=lastUpdated?'Updated '+lastUpdated.toLocaleTimeString():'';renderPodium(rows0);renderTable(rows,ranks);renderCategories(rows0)}
function renderPodium(rows){const top=rows.slice(0,3);document.getElementById('podium').innerHTML=top.length?top.map((e,i)=>'<div class="place '+(i===0?'first':'')+'"><div class="medal">'+(i===0?'🥇':i===1?'🥈':'🥉')+'</div><h2>'+esc(e.name)+'</h2><p>'+esc(e.title||'')+'</p><span class="badge">'+esc(e.registration_id)+'</span><div class="winnerScore">'+e.final_score.toFixed(2)+'</div><div class="muted">Final Score /100</div></div>').join(''):'<p class="muted">No scored entries yet.</p>'}
function renderTable(rows,ranks){document.getElementById('table').innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Participant</th><th>Reel</th><th>District</th><th>Category</th><th>Jury</th><th>Votes</th><th>Public</th><th>Final</th></tr>'+rows.map(e=>'<tr class="'+(ranks[e.id]<=3?'top':'')+'"><td><span class="rank">'+(ranks[e.id]===1?'🥇':ranks[e.id]===2?'🥈':ranks[e.id]===3?'🥉':ranks[e.id])+'</span></td><td>'+esc(e.registration_id)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td><span class="badge">'+esc(e.category)+'</span></td><td>'+e.jury_total+'/100</td><td>'+e.vote_count+'</td><td>'+e.public_score.toFixed(2)+'/100</td><td><b>'+e.final_score.toFixed(2)+'/100</b></td></tr>').join('')+'</table></div>':'<p class="muted">No scored entries found.</p>'}
function renderCategories(rows){const groups={};rows.filter(e=>e.category).forEach(e=>(groups[e.category]??=[]).push(e));document.getElementById('cats').innerHTML=Object.keys(groups).length?Object.keys(groups).map(c=>{const x=groups[c].sort((a,b)=>b.final_score-a.final_score||b.jury_total-a.jury_total)[0];return '<div class="category"><span class="badge">'+esc(c)+'</span><h3>🏆 '+esc(x.name)+'</h3><p>'+esc(x.title)+'</p><b>'+x.final_score.toFixed(2)+'/100</b></div>'}).join(''):'<p class="muted">No category data available.</p>'}
async function logout(){await sb.auth.signOut();login()}init();
</script></body></html>
