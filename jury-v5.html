<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Results V5 - GEN Z REEL FEST 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#101828;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:20px 14px 60px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{padding:16px;border-radius:14px;background:#f8f9fc}.num{font-size:30px;font-weight:800;margin-top:4px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}.dark{background:#111827}.green{background:#059669}.gold{background:#b7791f}.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:10px}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eee;text-align:left}.table th{font-size:13px;color:#667085;background:#fafafa;position:sticky;top:0}.rank{font-size:22px;font-weight:800}.winner{background:#fffbeb}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2ff}.score{font-weight:800;font-size:18px}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px}.hero{text-align:center;background:linear-gradient(135deg,#171d4d,#6d28d9);color:#fff}.hero h1{font-size:34px;margin:4px}.hero p{opacity:.9}.medal{font-size:25px}.weight{font-size:13px;color:#667085}.category{margin-top:22px}@media(max-width:700px){.filters{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:14px}}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};
const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let entries=[],votes=[];let juryWeight=70,publicWeight=30;
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||!['admin','manager','judge'].includes(p.role))return app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin/Jury access required.</p></div>';dashboard()}
function login(){app.innerHTML='<div class="card"><h2>🔐 Final Results Login</h2><p class="muted">Use your registered jury/admin email.</p><input id="email" type="email" placeholder="Your email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}
async function send(){const e=document.getElementById('email').value.trim();if(!e)return;const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});document.getElementById('msg').innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}
async function load(){const er=await sb.from('entries').select('*').order('created_at',{ascending:true});if(er.error)throw er.error;entries=er.data||[];const vr=await sb.from('votes').select('*');if(vr.error){votes=[];console.warn('votes table read:',vr.error.message)}else votes=vr.data||[]}
function voteCount(e){let n=0;for(const v of votes){const key=Object.keys(v);const rid=v.registration_id??v.entry_registration_id;const eid=v.entry_id??v.entryid??v.candidate_id??v.entryId;if(rid!=null&&String(rid)===String(e.registration_id))n++;else if(eid!=null&&String(eid)===String(e.id))n++;else if(v.entry_registration_id!=null&&String(v.entry_registration_id)===String(e.registration_id))n++}return n}
function compute(){const scored=entries.filter(e=>e.jury_total!=null);const maxVotes=Math.max(1,...scored.map(voteCount));return scored.map(e=>{const j=Number(e.jury_total)||0;const pv=(voteCount(e)/maxVotes)*100;const final=(j*juryWeight/100)+(pv*publicWeight/100);return {...e,vote_count:voteCount(e),public_score:pv,final_score:final}}).sort((a,b)=>b.final_score-a.final_score||b.jury_total-a.jury_total||b.vote_count-a.vote_count)}
function ranks(rows){let last=null,r=0;const out={};rows.forEach((x,i)=>{if(x.final_score!==last){r=i+1;last=x.final_score}out[x.id]=r});return out}
async function dashboard(){app.innerHTML='<div class="card hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Final Result Engine V5</p><div><b>Jury '+juryWeight+'%</b> + <b>Public Voting '+publicWeight+'%</b></div></div><div class="card"><div class="grid"><div class="stat"><b>Entries</b><div id="total" class="num">--</div></div><div class="stat"><b>Scored</b><div id="scored" class="num">--</div></div><div class="stat"><b>Total Votes</b><div id="votes" class="num">--</div></div><div class="stat"><b>Finalists</b><div id="finalists" class="num">--</div></div></div></div><div class="card"><h2>⚙️ Result Weightage</h2><div class="grid"><div><label>Jury Weight %</label><input id="jw" type="number" min="0" max="100" value="70"></div><div><label>Public Voting Weight %</label><input id="pw" type="number" min="0" max="100" value="30"></div></div><br><button class="btn" onclick="applyWeights()">CALCULATE FINAL RESULTS</button> <button class="btn dark" onclick="window.print()">PRINT / SAVE PDF</button></div><div class="card"><div class="filters"><input id="search" placeholder="Search registration, name or reel..." oninput="render()"><select id="scope" onchange="render()"><option value="finalists">Finalists</option><option value="all">All scored</option></select><select id="limit" onchange="render()"><option value="10">Top 10</option><option value="25">Top 25</option><option value="50">Top 50</option><option value="all">All</option></select></div></div><div class="card"><h2>🏆 Final Ranking</h2><div id="table"></div></div><div class="card category"><h2>🎖️ Category Winners</h2><div id="cats"></div></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';try{await load();render()}catch(e){app.innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
function applyWeights(){const j=Math.max(0,Math.min(100,Number(document.getElementById('jw').value)||0)),p=Math.max(0,Math.min(100,Number(document.getElementById('pw').value)||0));if(j+p!==100)return alert('Jury Weight + Public Voting Weight must equal 100.');juryWeight=j;publicWeight=p;render()}
function render(){const rows0=compute(),rankMap=ranks(rows0),q=(document.getElementById('search')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'finalists',lim=document.getElementById('limit')?.value||'10';let rows=rows0.filter(e=>{if(scope==='finalists'&&!e.is_finalist)return false;const t=[e.registration_id,e.name,e.title].join(' ').toLowerCase();return !q||t.includes(q)});if(lim!=='all')rows=rows.slice(0,Number(lim));document.getElementById('total').textContent=entries.length;document.getElementById('scored').textContent=rows0.length;document.getElementById('votes').textContent=votes.length;document.getElementById('finalists').textContent=entries.filter(e=>e.is_finalist).length;document.getElementById('table').innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Participant</th><th>Reel</th><th>Category</th><th>Jury /100</th><th>Public Votes</th><th>Public Score</th><th>Final Score</th></tr>'+rows.map(e=>'<tr class="'+(rankMap[e.id]<=3?'winner':'')+'"><td><span class="rank">'+(rankMap[e.id]===1?'🥇':rankMap[e.id]===2?'🥈':rankMap[e.id]===3?'🥉':rankMap[e.id])+'</span></td><td>'+esc(e.registration_id)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.title)+'</td><td>'+esc(e.category)+'</td><td>'+e.jury_total+'/100</td><td>'+e.vote_count+'</td><td>'+e.public_score.toFixed(2)+'/100</td><td><b>'+e.final_score.toFixed(2)+'/100</b></td></tr>').join('')+'</table></div>':'<p class="muted">No scored finalists found.</p>';renderCategories(rows0)}
function renderCategories(rows){const groups={};rows.filter(e=>e.category).forEach(e=>(groups[e.category]??=[]).push(e));const names=Object.keys(groups);document.getElementById('cats').innerHTML=names.length?'<div class="grid">'+names.map(c=>{const x=groups[c].sort((a,b)=>b.final_score-a.final_score)[0];return '<div class="stat"><span class="badge">'+esc(c)+'</span><h3>🏆 '+esc(x.name)+'</h3><p>'+esc(x.title)+'</p><b>Final Score: '+x.final_score.toFixed(2)+'/100</b></div>'}).join('')+'</div>':'<p class="muted">No category data available.</p>'}
async function logout(){await sb.auth.signOut();login()}init();
</script></body></html>
