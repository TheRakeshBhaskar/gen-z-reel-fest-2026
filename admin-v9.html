<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin V9 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.wrap{max-width:1250px;margin:auto;padding:18px 14px 50px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #1018280a}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#f8f9fc;padding:16px;border-radius:14px}.num{font-size:30px;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.green{background:#059669}.gold{background:#f59e0b;color:#111}.muted{color:#667085}.err{background:#fef2f2;padding:12px;border-radius:9px}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.filters{display:grid;grid-template-columns:2fr 160px 160px;gap:10px}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:9px;width:100%;box-sizing:border-box}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.top{background:#fffbeb}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:700}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.place{border:1px solid #e4e7ec;border-radius:16px;padding:18px;text-align:center}.first{background:#fffbeb}.medal{font-size:42px}.score{font-size:28px;font-weight:900}@media(max-width:700px){.filters,.podium{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let entries=[],scores=[],juryWeight=70,publicWeight=30;async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();const{data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||p.role!=='admin'){app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin access required.</p></div>';return}dashboard()}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login V9</h2><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=document.getElementById('email').value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});document.getElementById('msg').innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function dashboard(){app.innerHTML='<div class="card hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Admin Final Results V9</p><p>Jury <b>70%</b> + Public Voting <b>30%</b></p></div><div class="card"><div id="stats"></div></div><div class="card"><h2>🥇 Top 3</h2><div id="podium" class="podium"></div></div><div class="card"><h2>⚙️ Result Settings</h2><div class="grid"><div><label>Jury Weight %</label><input id="jw" type="number" value="70" min="0" max="100"></div><div><label>Public Weight %</label><input id="pw" type="number" value="30" min="0" max="100"></div></div><button class="btn" onclick="apply()">CALCULATE RESULTS</button><button class="btn dark" onclick="publish()">PUBLISH TOP 3</button><button class="btn gold" onclick="print()">PRINT / PDF</button><div class="muted">Jury scores are averaged across judges and normalized to 100. Public score is normalized against the highest vote count. Tie-break: final score → jury score → public votes → earlier registration.</div></div><div class="card"><div class="filters"><input id="q" placeholder="Search registration, name, reel or district" oninput="render()"><select id="scope" onchange="render()"><option value="finalists">Finalists only</option><option value="all">All scored</option></select><select id="lim" onchange="render()"><option>10</option><option>25</option><option>50</option><option value="all">All</option></select></div></div><div class="card"><h2>📊 Final Ranking</h2><div id="table"></div></div><div class="card"><h2>🏅 Category Winners</h2><div id="cats"></div></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';await load()}async function load(){const a=await sb.from('entries').select('id,registration_id,name,email,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(a.error){app.innerHTML='<div class="card err">'+esc(a.error.message)+'</div>';return}entries=a.data||[];const j=await sb.from('jury_scores').select('entry_id,judge_id,total');if(j.error){app.innerHTML='<div class="card err">Jury scores could not be loaded: '+esc(j.error.message)+'</div>';return}scores=j.data||[];render()}function calc(){const by={};scores.forEach(s=>{(by[s.entry_id]??=[]).push(Number(s.total)||0)});const scored=entries.filter(e=>by[e.id]?.length);const maxVotes=Math.max(1,...scored.map(e=>Number(e.public_votes)||0));return scored.map(e=>{const avg=by[e.id].reduce((a,b)=>a+b,0)/by[e.id].length;const jury=(avg/120)*100;const pub=((Number(e.public_votes)||0)/maxVotes)*100;const final=jury*juryWeight/100+pub*publicWeight/100;return{...e,judges:by[e.id].length,jury,juryRaw:avg,pub,final}}).sort((a,b)=>b.final-a.final||b.jury-a.jury||(b.public_votes||0)-(a.public_votes||0)||String(a.created_at).localeCompare(String(b.created_at)))}function ranks(rows){const r={};let rank=0,last=null;rows.forEach((x,i)=>{if(x.final!==last){rank=i+1;last=x.final}r[x.id]=rank});return r}function render(){const rows0=calc(),rk=ranks(rows0),q=(document.getElementById('q')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'finalists',lim=document.getElementById('lim')?.value||'10';let rows=rows0.filter(e=>(scope==='all'||e.is_finalist)&&[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase().includes(q));if(lim!=='all')rows=rows.slice(0,Number(lim));document.getElementById('stats').innerHTML='<div class="grid"><div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Scored</b><div class="num">'+rows0.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+entries.filter(e=>e.is_finalist).length+'</div></div><div class="stat"><b>Total Public Votes</b><div class="num">'+entries.reduce((a,e)=>a+(Number(e.public_votes)||0),0)+'</div></div></div>';document.getElementById('podium').innerHTML=rows0.length?rows0.slice(0,3).map((e,i)=>'<div class="place '+(i===0?'first':'')+'"><div class="medal">'+(i===0?'🥇':i===1?'🥈':'🥉')+'</div><h2>'+esc(e.name)+'</h2><p>'+esc(e.title)+'</p><span class="badge">'+esc(e.registration_id)+'</span><div class="score">'+e.final.toFixed(2)+'</div><div class="muted">Final / 100</div></div>').join(''):'<p class="muted">No scored entries yet.</p>';document.getElementById('table').innerHTML=rows.length?'<div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Category</th><th>Jury Avg</th><th>Judges</th><th>Votes</th><th>Public Score</th><th>Final</th></tr>'+rows.map(e=>'<tr class="'+(rk[e.id]<=3?'top':'')+'"><td><b>'+rk[e.id]+'</b></td><td>'+esc(e.registration_id)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+esc(e.category)+'</td><td>'+e.jury.toFixed(2)+'</td><td>'+e.judges+'</td><td>'+e.public_votes+'</td><td>'+e.pub.toFixed(2)+'</td><td><b>'+e.final.toFixed(2)+'</b></td></tr>').join('')+'</table></div>':'<p class="muted">No scored entries found.</p>';const groups={};rows0.forEach(e=>(groups[e.category]??=[]).push(e));document.getElementById('cats').innerHTML=Object.keys(groups).length?'<div class="grid">'+Object.keys(groups).map(c=>{const x=groups[c][0];return '<div class="stat"><span class="badge">'+esc(c)+'</span><h3>🏆 '+esc(x.name)+'</h3><p>'+esc(x.title)+'</p><b>'+x.final.toFixed(2)+'/100</b></div>'}).join('')+'</div>':'<p class="muted">No category winners yet.</p>'}function apply(){const j=Number(document.getElementById('jw').value),p=Number(document.getElementById('pw').value);if(j+p!==100)return alert('Jury Weight + Public Weight must equal 100.');juryWeight=j;publicWeight=p;render()}async function publish(){const rows=calc().slice(0,3);if(rows.length<3)return alert('Need at least 3 scored entries.');const payload=rows.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'}));const del=await sb.from('results').delete().gte('rank',1);if(del.error)return alert(del.error.message);const ins=await sb.from('results').insert(payload);if(ins.error)return alert(ins.error.message);alert('Top 3 published successfully.');}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
