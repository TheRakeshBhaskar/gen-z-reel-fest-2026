<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>Jury Management V21 - GEN Z REEL FEST 2026</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1050px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%;font-size:16px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.red{background:#d92d20}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.table{overflow:auto}.table table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.btn{width:100%;margin:4px 0}.hero{border-radius:12px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap" id="app"><div class="card"><h2>Loading Jury Management...</h2><p class="muted">Checking Admin access.</p></div></main><script>(function(){'use strict';const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const app=document.getElementById('app');let sb=null,judges=[];const esc=x=>String(x==null?'':x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));function fail(m){app.innerHTML='<div class="card err"><h2>⚠️ Jury page error</h2><p>'+esc(m)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin Login</h2><p class="muted">Use your authorized Admin email.</p><input id="loginEmail" type="email" placeholder="Admin email"><br><br><button id="sendBtn" class="btn">SEND LOGIN LINK</button><div id="loginMsg"></div></div>';document.getElementById('sendBtn').onclick=send}async function send(){const e=document.getElementById('loginEmail').value.trim(),m=document.getElementById('loginMsg');if(!e)return m.innerHTML='<div class="err">Enter email.</div>';const r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});m.innerHTML=r.error?'<div class="err">'+esc(r.error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function init(){try{if(!window.supabase||!window.supabase.createClient)throw new Error('Supabase JavaScript library did not load. Refresh the page.');sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const s=await sb.auth.getSession();if(s.error)throw s.error;const u=s.data.session?.user||null;if(!u){login();return}const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(p.data?.role!=='admin'){app.innerHTML='<div class="card err"><h2>🔒 Admin only</h2><p>Only an Admin can manage Jury accounts.</p><button class="btn dark" id="logout">LOGOUT</button></div>';document.getElementById('logout').onclick=logout;return}render();await load()}catch(e){fail(e?.message||String(e))}}function render(){app.innerHTML='<section class="hero"><h1>👨‍⚖️ Jury Management</h1><p>GEN Z REEL FEST 2026</p><span class="badge">ADMIN ONLY</span></section><div class="card"><h2>👨‍⚖️ Jury Accounts</h2><p class="muted">Existing authenticated users with the <b>judge</b> role are shown below. You can change the role or remove the judge role. New Auth users must first be created in Supabase Authentication, then assigned here.</p><div id="list">Loading...</div></div><div class="card"><h2>➕ Add Existing User as Jury</h2><p class="muted">Enter the exact Auth User UUID from Supabase → Authentication → Users. This does not create an Auth account or password.</p><div class="grid"><div class="field"><label>User UUID</label><input id="uid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div><div class="field"><label>Role</label><select id="role"><option value="judge">Judge</option><option value="manager">Manager</option></select></div></div><br><button class="btn" id="add">ASSIGN JURY ROLE</button><div id="msg"></div></div><div class="card"><button class="btn dark" id="back">← BACK TO ADMIN</button><button class="btn dark" id="logout2">LOGOUT</button></div>';document.getElementById('add').onclick=add;document.getElementById('back').onclick=()=>location.href='admin-v19.html';document.getElementById('logout2').onclick=logout}async function load(){const r=await sb.from('profiles').select('id,role').in('role',['judge','manager']).order('role');if(r.error)throw r.error;judges=r.data||[];document.getElementById('list').innerHTML=judges.length?'<div class="table"><table><tr><th>User ID</th><th>Role</th><th>Actions</th></tr>'+judges.map(j=>'<tr><td><code>'+esc(j.id)+'</code></td><td>'+esc(j.role)+'</td><td><button class="btn" data-id="'+esc(j.id)+'" data-role="'+esc(j.role)+'">CHANGE ROLE</button><button class="btn red" data-del="'+esc(j.id)+'">REMOVE JURY</button></td></tr>').join('')+'</table></div>':'<p class="muted">No Jury accounts found.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>changeRole(b.dataset.id,b.dataset.role==='judge'?'manager':'judge'));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeJudge(b.dataset.del))}async function add(){const id=document.getElementById('uid').value.trim(),role=document.getElementById('role').value,m=document.getElementById('msg');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id))return m.innerHTML='<div class="err">Enter a valid User UUID.</div>';const r=await sb.from('profiles').upsert({id,role},{onConflict:'id'});if(r.error)return m.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';m.innerHTML='<div class="ok">Jury role assigned successfully.</div>';document.getElementById('uid').value='';await load()}async function changeRole(id,role){const r=await sb.from('profiles').update({role}).eq('id',id);if(r.error)return alert(r.error.message);await load()}async function removeJudge(id){if(!confirm('Remove this user from Jury? Their existing scores remain safe.'))return;const r=await sb.from('profiles').update({role:'participant'}).eq('id',id);if(r.error)return alert(r.error.message);await load()}async function logout(){if(sb)await sb.auth.signOut();login()}window.addEventListener('error',e=>fail(e.message||'Unexpected JavaScript error.'));window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||String(e.reason||'Unexpected error.')));init()})();</script></body></html>
