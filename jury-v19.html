<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#312e81">
<title>Jury Scoring V19.1 - GEN Z REEL FEST 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1200px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.hero h1{margin:5px 0;font-size:clamp(28px,6vw,48px)}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.criteria{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#f8f9fc;padding:14px;border-radius:13px}.num{font-size:27px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 180px 150px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:900px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.top{background:#fffbeb}.score{font-size:18px;font-weight:900}.field{display:flex;flex-direction:column;gap:6px}.field input{font-size:18px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.criteria{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.hero{border-radius:12px}.btn{width:100%;margin:4px 0}}@media(max-width:420px){.grid,.criteria{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="card"><h2>Loading Jury Dashboard...</h2></div></main>
<script>
(function(){
'use strict';
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};
let sb=null,user=null,role='',entries=[],myScores=[];
const app=document.getElementById('app');
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fail(m){app.innerHTML='<div class="card err"><h2>⚠️ Jury page error</h2><p>'+esc(m)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>';}
function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Jury Login</h2><p class="muted">Use your authorized jury/admin email.</p><input id="loginEmail" type="email" placeholder="Authorized email"><br><br><button id="sendBtn" class="btn">SEND LOGIN LINK</button><div id="loginMsg"></div></div>';document.getElementById('sendBtn').onclick=send;}
async function send(){const e=document.getElementById('loginEmail').value.trim(),m=document.getElementById('loginMsg');if(!e){m.innerHTML='<div class="err">Please enter your email.</div>';return}const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});m.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>';}
async function init(){try{if(!window.supabase?.createClient)throw new Error('Supabase library did not load. Refresh the page.');sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);const s=await sb.auth.getSession();if(s.error)throw s.error;user=s.data.session?.user||null;if(!user)return login();const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||!['admin','manager','judge'].includes(p.data.role)){app.innerHTML='<div class="card err"><h2>🔒 Access denied</h2><p>Admin, Manager or Judge access is required.</p><button class="btn dark" id="logout0">LOGOUT</button></div>';document.getElementById('logout0').onclick=logout;return}role=p.data.role;await load();}catch(e){fail(e?.message||String(e));}}
async function load(){try{const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,reel_url,created_at').order('created_at',{ascending:true});if(a.error)throw a.error;entries=a.data||[];const j=await sb.from('jury_scores').select('entry_id,judge_id,total').eq('judge_id',user.id);if(j.error)throw j.error;myScores=j.data||[];dashboard();}catch(e){fail(e?.message||String(e));}}
function dashboard(){app.innerHTML='<section class="hero"><h1>🎯 GEN Z REEL FEST 2026</h1><p>Jury Scoring Dashboard V19.1</p><span class="badge">ROLE: '+esc(role.toUpperCase())+'</span></section><div class="card"><p><b>Jury:</b> '+esc(user.email||'')+'</p><div class="grid" id="stats"></div></div><div class="card"><h2>Jury Entries</h2><div class="filters"><input id="q" placeholder="Search registration, name, reel, district"><select id="scope"><option value="all">All entries</option><option value="finalists">Finalists only</option><option value="scored">My scored</option><option value="unscored">Not scored by me</option></select><select id="limit"><option value="25">25 rows</option><option value="50">50 rows</option><option value="all">All</option></select></div></div><div class="card"><div id="table"></div></div><div class="card"><button id="logout" class="btn dark">LOGOUT</button></div>';document.getElementById('q').oninput=render;document.getElementById('scope').onchange=render;document.getElementById('limit').onchange=render;document.getElementById('logout').onclick=logout;render();}
function scoreMap(){const m={};myScores.forEach(x=>m[x.entry_id]=Number(x.total)||0);return m;}
function render(){const m=scoreMap(),q=(document.getElementById('q')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'all',lim=document.getElementById('limit')?.value||'25';let rows=entries.filter(e=>{const text=[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase();if(q&&!text.includes(q))return false;if(scope==='finalists'&&!e.is_finalist)return false;if(scope==='scored'&&!Object.prototype.hasOwnProperty.call(m,e.id))return false;if(scope==='unscored'&&Object.prototype.hasOwnProperty.call(m,e.id))return false;return true});if(lim!=='all')rows=rows.slice(0,Number(lim));document.getElementById('stats').innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+entries.filter(e=>e.is_finalist).length+'</div></div><div class="stat"><b>Scored by Me</b><div class="num">'+myScores.length+'</div></div><div class="stat"><b>Pending</b><div class="num">'+Math.max(0,entries.length-myScores.length)+'</div></div>';document.getElementById('table').innerHTML=rows.length?'<div class="table"><table><tr><th>Registration</th><th>Participant</th><th>Reel</th><th>District</th><th>Finalist</th><th>My Score</th><th>Action</th></tr>'+rows.map(e=>'<tr class="'+(e.is_finalist?'top':'')+'"><td>'+esc(e.registration_id)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+(e.is_finalist?'✅':'—')+'</td><td class="score">'+(m[e.id]??'—')+'/100</td><td><button type="button" class="btn scoreBtn" data-entry-id="'+esc(e.id)+'">'+(m[e.id]!=null?'EDIT SCORE':'SCORE')+'</button></td></tr>').join('')+'</table></div>':'<p class="muted">No entries found.</p>';document.querySelectorAll('.scoreBtn').forEach(b=>b.addEventListener('click',function(){openScore(this.dataset.entryId);}));}
async function openScore(id){const e=entries.find(x=>x.id===id);if(!e)return;const existing=scoreMap()[id];app.innerHTML='<div class="card"><h2>🎬 Score Reel</h2><p><b>'+esc(e.registration_id)+'</b> • '+esc(e.name)+'</p><h3>'+esc(e.title||'Untitled Reel')+'</h3><p class="muted">Each criterion is 0–20. Total must be 0–100.</p><div class="criteria">'+field('Creativity','c')+field('Content','co')+field('Editing','ed')+field('Presentation','pr')+field('Local Connect','lc')+'</div><br><div class="ok">Total: <b id="total">0</b>/100</div><br>'+(e.reel_url?'<a class="btn dark" target="_blank" href="'+esc(e.reel_url)+'">OPEN REEL</a>':'')+'<button id="save" class="btn">SAVE SCORE</button><button id="back" class="btn dark">BACK</button><div id="msg"></div></div>';['c','co','ed','pr','lc'].forEach(k=>document.getElementById(k).oninput=updateTotal);document.getElementById('save').onclick=()=>saveScore(id);document.getElementById('back').onclick=dashboard;if(existing!=null){const each=Math.floor(existing/5),rem=existing%5;['c','co','ed','pr','lc'].forEach((k,i)=>document.getElementById(k).value=each+(i<rem?1:0));updateTotal();}}
function field(label,id){return '<div class="field"><label><b>'+label+'</b> (0–20)</label><input id="'+id+'" type="number" min="0" max="20" value="0"></div>';}
function updateTotal(){const t=['c','co','ed','pr','lc'].reduce((a,k)=>a+Math.max(0,Math.min(20,Number(document.getElementById(k).value)||0)),0);document.getElementById('total').textContent=t;}
async function saveScore(entryId){const vals=['c','co','ed','pr','lc'].map(k=>Math.max(0,Math.min(20,Number(document.getElementById(k).value)||0)));const total=vals.reduce((a,b)=>a+b,0),m=document.getElementById('msg');const row={entry_id:entryId,judge_id:user.id,total};const r=await sb.from('jury_scores').upsert(row,{onConflict:'entry_id,judge_id'});if(r.error){m.innerHTML='<div class="err">'+esc(r.error.message)+'</div>';return}m.innerHTML='<div class="ok">Score saved successfully: <b>'+total+'/100</b></div>';await new Promise(r=>setTimeout(r,500));await load();}
async function logout(){if(sb)await sb.auth.signOut();login();}
window.addEventListener('error',e=>{if(!document.querySelector('.err'))fail(e.message||'Unexpected JavaScript error.');});
window.addEventListener('unhandledrejection',e=>{if(!document.querySelector('.err'))fail(e.reason?.message||String(e.reason||'Unexpected error.'));});
init();
})();
</script>
</body>
</html>
