pabase.createClient(U,K),app=document.getElementById('app');let role='',entries=[],scores=[],profiles={},judges=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const name=j=>esc(j?.full_name||j?.email||'Judge');function err(x){app.innerHTML='<div class="card err"><h2>⚠️ Error</h2><p>'+esc(x)+'</p><button class="btn dark" onclick="location.reload()">RELOAD</button></div>'}function calc(){const m={};scores.forEach(s=>(m[s.entry_id]??=[]).push(s));return entries.map(e=>{const r=(m[e.id]||[]).filter(s=>judges.some(j=>j.id===s.judge_id)),ids=new Set(r.map(s=>s.judge_id)),pending=judges.filter(j=>!ids.has(j.id)),complete=!!e.is_finalist&&judges.length>0&&r.length===judges.length&&judges.every(j=>ids.has(j.id)),avg=r.length?r.reduce((a,s)=>a+Number(s.total||0),0)/r.length:0;return {...e,rows:r,judges:ids.size,pending,complete,avg}})}function ranking(){return calc().filter(e=>e.is_finalist&&e.complete).sort((a,b)=>b.avg-a.avg||Number(b.public_votes||0)-Number(a.public_votes||0))}async function load(){const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes').order('created_at',{ascending:true});if(a.error)throw a.error;entries=a.data||[];const s=await sb.from('jury_scores').select('id,entry_id,judge_id,total').order('created_at',{ascending:true});if(s.error)throw s.error;scores=s.data||[];const p=await sb.from('profiles').select('id,full_name,email,role');if(p.error)throw p.error;profiles={};(p.data||[]).forEach(x=>profiles[x.id]=x);judges=(p.data||[]).filter(x=>x.role==='judge');render()}function render(){const all=calc(),ranked=ranking(),map={};ranked.forEach((e,i)=>map[e.id]=i+1);const fin=all.filter(e=>e.is_finalist),pending=fin.filter(e=>!e.complete),published=localStorage.getItem('gzrf_published_at');document.getElementById('app').innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>Admin • Final Ranking • Protected Publish</p><b>'+esc(role.toUpperCase())+'</b></section><div class="card"><div class="grid"><div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+fin.length+'</div></div><div class="stat"><b>Valid Ranked</b><div class="num">'+ranked.length+'</div></div><div class="stat"><b>Pending</b><div class="num">'+pending.length+'</div></div><div class="stat"><b>Registered Judges</b><div class="num">'+judges.length+'</div></div></div></div><div class="card"><h2>🏆 Publish Status</h2>'+(published?'<div class="ok"><b>Results Published</b><br>'+esc(new Date(published).toLocaleString())+'<br><span class="muted">Re-publishing will replace the current official Top 3.</span></div>':'<div class="warn"><b>Results not published in this browser session.</b><br>Only fully scored finalists can be published.</div>')+'<br><button class="btn gold" id="pub">PUBLISH / RE-PUBLISH TOP 3</button><button class="btn dark" id="res">VIEW OFFICIAL RESULTS</button></div><div class="card"><h2>Final Ranking</h2><p class="muted">Rank is generated only when every registered Judge has scored the finalist.</p><div class="table"><table><tr><th>Rank</th><th>Registration</th><th>Name</th><th>Reel</th><th>Jury Average</th><th>Judges</th><th>Status</th><th>Action</th></tr>'+all.map(e=>'<tr class="'+(e.is_finalist?'top':'')+'"><td class="rank">'+(map[e.id]||'—')+'</td><td>'+esc(e.registration_id)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.title)+'</td><td>'+(e.judges?e.avg.toFixed(2)+'/100':'—')+'</td><td>'+e.judges+'/'+judges.length+'</td><td class="'+(e.complete?'complete':'pending')+'">'+(e.is_finalist?(e.complete?'✅ Complete':'⏳ Pending: '+e.pending.map(name).join(', ')):'Not finalist')+'</td><td>'+(e.is_finalist?'<button class="btn blue" data-score="'+e.id+'">🎯 SCORE</button>':'')+(e.is_finalist?'<button class="btn dark" data-view="'+e.id+'">VIEW SCORES</button>':'')+'</td></tr>').join('')+'</table></div></div><div class="card"><button class="btn dark" id="jury">JURY MANAGEMENT</button><button class="btn dark" id="logout">LOGOUT</button></div>';document.getElementById('pub').onclick=publish;document.getElementById('res').onclick=()=>location.href='results-v17.html?v='+Date.now();document.getElementById('jury').onclick=()=>location.href='jury-manage-v23.html';document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>location.href='jury-v19.html?entry='+encodeURIComponent(b.dataset.score));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>alert('Use VIEW SCORES from Admin V26/V28 for judge-wise details.'))}async function publish(){const r=ranking().slice(0,3);if(judges.length===0)return alert('No registered Judges.');if(r.length<3)return alert('At least 3 fully scored finalists are required.');if(!confirm('Current valid Top 3 will replace the official results. Continue?'))return;const old=await sb.from('results').delete().not('registration_id','is',null);if(old.error)return alert('Could not prepare results: '+old.error.message);const data=r.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'}));const ins=await sb.from('results').insert(data);if(ins.error)return alert('Publish failed: '+ins.error.message);localStorage.setItem('gzrf_published_at',new Date().toISOString());alert('Top 3 published successfully.');render()}try{const s=await sb.auth.getSession(),u=s.data?.session?.user;if(!u){app.innerHTML='<div class="card"><h2>🔐 Admin Login</h2><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" id="login">SEND LOGIN LINK</button><div id="msg"></div></div>';document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),m=document.getElementById('msg');const x=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});m.textContent=x.error?x.error.message:'Login link sent.'};return}const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(!['admin','manager'].includes(p.data?.role))return err('Admin or Manager access required.');role=p.data.role;await load()}catch(e){err(e.message||String(e))}})();</script></body></html>
