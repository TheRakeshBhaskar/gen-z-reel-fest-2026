<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Settings V26 | GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f5f7fb;color:#101828}.wrap{max-width:1050px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;border-radius:18px;padding:26px;text-align:center}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:4px}.dark{background:#111827}.green{background:#079455}.warn{background:#fffaeb;color:#92400e;padding:12px;border-radius:10px}.note{background:#ecfdf3;color:#067647;padding:12px;border-radius:10px}.thumb{max-width:520px;max-height:280px;display:block;margin:10px auto;border:1px solid #ddd}.judge{border:1px solid #eaecf0;border-radius:12px;padding:14px;margin:10px 0}.status{margin-top:8px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><h1>⚙️ Certificate Settings V26</h1><p>GEN Z REEL FEST 2026</p><p>Design, Jury & Signature Settings</p></header><section class="card"><h2>🎨 Certificate Design</h2><div class="field"><label>Upload / Replace Certificate Design</label><input id="design" type="file" accept="image/png,image/jpeg,image/webp"></div><img id="designPreview" class="thumb hidden"><div id="designStatus" class="status note">Loading saved design...</div><p class="note">Default: no design is required. Upload only when you are ready.</p></section><section class="card"><h2>⚖️ Jury Settings</h2><div id="status" class="warn">Loading registered judges...</div><div id="judges"></div></section><section class="card"><h2>💾 Certificate Settings</h2><div class="grid"><div class="field"><label>Organizer / Issued By</label><input id="issuer" value="GEN Z REEL FEST 2026"></div><div class="field"><label>Certificate Footer</label><input id="footer" value="Official Final Result"></div></div><button class="btn green" id="save">SAVE SETTINGS</button><button class="btn dark" id="reset">RESET CERTIFICATE SETTINGS</button><a class="btn" href="certificate-v27.html?reg=RB-GZR-2026-00006">PREVIEW CERTIFICATE</a><div id="msg"></div></section></main><script>(async()=>{const U='https://tewprfdirrhpaowvqyhj.supabase.co',K='sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j',sb=supabase.createClient(U,K),bucket='certificate-assets',$=id=>document.getElementById(id);let judges=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const msg=(t,ok=true)=>{$('msg').innerHTML='<div class="'+(ok?'note':'warn')+'">'+esc(t)+'</div>'};async function auth(){const s=await sb.auth.getSession(),u=s.data?.session?.user;if(!u)throw new Error('Admin login required.');const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error)throw p.error;if(p.data?.role!=='admin')throw new Error('Admin access required.');return u}async function upload(file,path){if(!file)return null;const r=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl}async function loadSettings(){const r=await sb.from('certificate_settings').select('*').eq('id',1).maybeSingle();if(r.error)throw r.error;if(r.data){$('issuer').value=r.data.issuer||'GEN Z REEL FEST 2026';$('footer').value=r.data.footer||'Official Final Result';if(r.data.design_url){$('designPreview').src=r.data.design_url;$('designPreview').classList.remove('hidden');$('designStatus').textContent='☁️ Saved design is stored in Supabase.'}else $('designStatus').textContent='No design uploaded.'}}async function loadJudges(){const r=await sb.from('profiles').select('id,full_name,email,role').eq('role','judge').order('created_at',{ascending:true});if(r.error)throw r.error;judges=r.data||[];if(!judges.length){$('status').className='warn';$('status').textContent='⚠️ No registered judges found.';$('judges').innerHTML='';return}$('status').className='note';$('status').textContent='✅ '+judges.length+' registered judge(s). Names are automatic.';const ids=judges.map(j=>j.id),j=await sb.from('certificate_jury_settings').select('judge_id,post,signature_url').in('judge_id',ids);if(j.error)throw j.error;const saved={};(j.data||[]).forEach(x=>saved[x.judge_id]=x);$('judges').innerHTML=judges.map(x=>{const s=saved[x.id]||{};return '<div class="judge"><h3>👨‍⚖️ '+esc(x.full_name||x.email||'Judge')+'</h3><div>Judge ID: '+esc(x.id)+'</div><div class="field"><label>Post / Designation</label><input id="title_'+x.id+'" value="'+esc(s.post||'')+'" placeholder="उदा. Jury Member"></div><div class="field"><label>Signature</label><input id="sig_'+x.id+'" type="file" accept="image/png,image/jpeg,image/webp"></div>'+(s.signature_url?'<div class="note">☁️ Signature already uploaded.</div>':'<div class="warn">No signature uploaded.</div>')+'</div>'}).join('')}async function save(){try{await auth();const designFile=$('design').files[0];let designUrl=null;if(designFile){designUrl=await upload(designFile,'design/certificate-'+Date.now()+'.'+(designFile.name.split('.').pop()||'png'));}const current=await sb.from('certificate_settings').select('design_url').eq('id',1).maybeSingle();if(current.error)throw current.error;const up={id:1,issuer:$('issuer').value.trim()||'GEN Z REEL FEST 2026',footer:$('footer').value.trim()||'Official Final Result',updated_at:new Date().toISOString(),design_url:designUrl||current.data?.design_url||null};const c=await sb.from('certificate_settings').upsert(up);if(c.error)throw c.error;for(const x of judges){const file=$('sig_'+x.id)?.files?.[0];let url=null;if(file)url=await upload(file,'signatures/'+x.id+'-'+Date.now()+'.'+(file.name.split('.').pop()||'png'));const existing=await sb.from('certificate_jury_settings').select('post,signature_url').eq('judge_id',x.id).maybeSingle();if(existing.error)throw existing.error;const row={judge_id:x.id,post:$('title_'+x.id)?.value?.trim()||null,signature_url:url||existing.data?.signature_url||null,updated_at:new Date().toISOString()};const q=await sb.from('certificate_jury_settings').upsert(row);if(q.error)throw q.error}msg('Settings saved permanently in Supabase.');await loadSettings();await loadJudges()}catch(e){msg(e.message||String(e),false)}}async function reset(){if(!confirm('Reset certificate design, signatures, posts and text settings?'))return;try{await auth();const a=await sb.from('certificate_settings').update({design_url:null,logo_url:null,issuer:'GEN Z REEL FEST 2026',footer:'Official Final Result',updated_at:new Date().toISOString()}).eq('id',1);if(a.error)throw a.error;const b=await sb.from('certificate_jury_settings').delete().neq('judge_id','00000000-0000-0000-0000-000000000000');if(b.error)throw b.error;$('designPreview').classList.add('hidden');$('designStatus').textContent='No design uploaded.';msg('Certificate settings reset. No new asset was uploaded.')}catch(e){msg(e.message||String(e),false)}}$('design').onchange=()=>{const f=$('design').files[0];if(f){$('designPreview').src=URL.createObjectURL(f);$('designPreview').classList.remove('hidden');$('designStatus').textContent='Ready to upload. Click SAVE SETTINGS.'}};$('save').onclick=save;$('reset').onclick=reset;try{await auth();await loadSettings();await loadJudges()}catch(e){document.body.innerHTML='<main class="wrap"><div class="card warn"><h2>🔐 Certificate Settings</h2><p>'+esc(e.message)+'</p><a class="btn" href="admin-v31.html?v=31">← Admin Control Center</a></div></main>'}})();</script></body></html>
