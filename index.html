<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f6f7fb;color:#101828}.hero{padding:65px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#111827,#312e81,#7c3aed)}h1{font-size:clamp(34px,6vw,62px)}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:5}nav button,.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}nav button{background:#fff}.btn{background:#f59e0b}.btn.dark{background:#111827;color:#fff}.btn.purple{background:#7c3aed;color:#fff}.wrap{max-width:1150px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field textarea{padding:11px;border:1px solid #d0d5dd;border-radius:8px}.full{grid-column:1/-1}.banner{width:100%;max-height:470px;object-fit:cover;border-radius:16px}.count{display:flex;justify-content:center;gap:10px}.time{background:#ffffff18;padding:12px;border-radius:10px;min-width:65px}.time b{display:block;font-size:25px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}.ok,.err{padding:12px;border-radius:9px}.ok{background:#ecfdf3}.err{background:#fef2f2}</style></head><body><header class="hero"><b>Bhandara × Gondia • 2026</b><h1>GEN Z REEL FEST 2026</h1><p>तुमची कल्पना. तुमची Reel. तुमचा मंच.</p><div class="count"><div class="time"><b id="d">--</b>Days</div><div class="time"><b id="h">--</b>Hours</div><div class="time"><b id="m">--</b>Minutes</div><div class="time"><b id="s">--</b>Seconds</div></div><button class="btn" onclick="page('register')">REGISTER NOW</button></header><nav><button onclick="page('home')">Home</button><button onclick="page('about')">About</button><button onclick="page('rules')">Rules</button><button onclick="page('themes')">Themes</button><button onclick="page('prizes')">Prizes</button><button onclick="page('register')">Register Now</button><button onclick="page('status')">Check Status</button><button onclick="page('login')">Participant Login</button><button onclick="page('reels')">Top Reels</button><button onclick="page('results')">Results</button><button onclick="page('admin')">Admin / Jury</button></nav><main class="wrap" id="app"></main><script>
const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j};let sb,eventData={};const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const notice=(x,c='ok')=>`<div class="${c}">${esc(x)}</div>`;
function init(){if(CONFIG.SUPABASE_URL.startsWith('PASTE_')||CONFIG.SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){app.innerHTML='<div class="card"><h2>V6.0 Setup</h2><p>Add the Supabase URL and Publishable Key in index.html.</p></div>';return}sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);loadSettings().then(()=>page('home'))}
async function loadSettings(){const {data}=await sb.from('event_settings').select('*').eq('id',1).maybeSingle();eventData=data||{};const t=Date.parse(eventData.registration_end);setInterval(()=>{if(!t)return;let x=Math.max(0,t-Date.now());d.textContent=Math.floor(x/86400000);h.textContent=Math.floor(x%86400000/3600000);m.textContent=Math.floor(x%3600000/60000);s.textContent=Math.floor(x%60000/1000)},1000)}
async function page(p){if(!sb)return init();if(p==='home')return home();if(p==='register')return register();if(p==='login')return login();if(p==='status')return status();if(p==='reels')return reels();if(p==='results')return results();if(p==='admin')return admin();const t={about:['About Competition','Bhandara आणि Gondia जिल्ह्यातील Gen Z creators साठी Reel Competition.'],rules:['Rules','Original Reel, valid Instagram URL आणि आयोजकांच्या deadlines चे पालन आवश्यक.'],themes:['Themes','Local Culture • Youth • Tourism • Social Message • Innovation • Local Connect'],prizes:['Prizes','Winner • 1st Runner Up • 2nd Runner Up • Special Awards.']}[p];app.innerHTML=`<div class="card"><h2>${t[0]}</h2><p>${t[1]}</p></div>`}
function home(){app.innerHTML=`${eventData.banner_url?`<img class="banner" src="${esc(eventData.banner_url)}">`:''}<div class="card"><h2>${esc(eventData.event_title||'GEN Z REEL FEST 2026')}</h2><p>${esc(eventData.event_description||'तुमची कल्पना. तुमची Reel. तुमचा मंच.')}</p><div class="grid"><div><b>📅 Date</b><p>${esc(eventData.event_date||'To be announced')}</p></div><div><b>⏰ Time</b><p>${esc(eventData.event_time||'To be announced')}</p></div><div><b>📍 Venue</b><p>${esc(eventData.event_venue||'Bhandara × Gondia')}</p></div></div></div>`}
function field(l,n,t='text',r=false){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" ${r?'required':''}></div>`}
function register(){app.innerHTML=`<div class="card"><h2>📝 Registration</h2><form id="rf" class="grid">${field('Full Name','name','text',true)}${field('Date of Birth','dob','date')}${field('District','district','text',true)}${field('Taluka','taluka')}${field('Village / City','village')}${field('Mobile','mobile','tel',true)}${field('WhatsApp','whatsapp','tel')}${field('Email','email','email',true)}${field('Instagram Username','instagram')}${field('YouTube Username','youtube')}${field('Reel Category','category','text',true)}${field('Reel Title','title','text',true)}${field('Reel URL','reel_url','url',true)}<div class="full"><label><input name="consent" type="checkbox" value="true" required> I accept the rules and publication consent.</label></div><div class="full"><button class="btn purple">SUBMIT ENTRY</button></div></form><div id="rm"></div></div>`;rf.onsubmit=submit}
async function submit(e){e.preventDefault();const f=new FormData(rf),x=Object.fromEntries(f.entries());if(!eventData.registration_open){rm.innerHTML=notice('Registration is closed.','err');return}const {data:{user},error:ae}=await sb.auth.signInWithOtp({email:x.email,options:{shouldCreateUser:true}});if(ae){rm.innerHTML=notice(ae.message,'err');return}const {data:u}=await sb.auth.getUser();x.user_id=u.user?.id||null;x.consent=true;const {data:r,error}=await sb.from('entries').insert(x).select('registration_id').single();rm.innerHTML=error?notice(error.message,'err'):notice('Registration successful. ID: '+r.registration_id+' | Login link sent to your email.');}
function login(){app.innerHTML=`<div class="card"><h2>👤 Participant Login</h2><div class="field"><label>Email</label><input id="le" type="email"></div><br><button class="btn purple" onclick="sendLogin()">SEND LOGIN LINK</button><div id="lm"></div></div>`}async function sendLogin(){const {error}=await sb.auth.signInWithOtp({email:le.value,options:{emailRedirectTo:location.href}});lm.innerHTML=error?notice(error.message,'err'):notice('Login link sent to your email.')}
async function status(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data,error}=await sb.from('entries').select('*').eq('user_id',user.id);app.innerHTML=error?notice(error.message,'err'):`<div class="card"><h2>📊 My Entries</h2>${(data||[]).map(x=>`<div class="card"><b>${esc(x.registration_id)}</b><p>${esc(x.title)} • ${esc(x.status)} • Votes: ${x.public_votes||0}</p><a class="btn" target="_blank" href="${esc(x.reel_url)}">VIEW REEL</a></div>`).join('')}<button class="btn dark" onclick="logout()">LOGOUT</button></div>`}
async function reels(){const {data,error}=await sb.from('entries').select('*').eq('is_finalist',true).eq('status','Finalist').order('public_votes',{ascending:false});if(error)return app.innerHTML=notice(error.message,'err');app.innerHTML=`<div class="card"><h2>🔥 TOP REELS</h2><div class="grid">${(data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.title)} • ${esc(x.category)}</p><p>❤️ ${x.public_votes||0}</p><a class="btn" target="_blank" href="${esc(x.reel_url)}">VIEW REEL</a> <button class="btn purple" onclick="vote('${x.id}')">VOTE</button></div>`).join('')}</div></div>`}
async function vote(id){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {error}=await sb.from('votes').insert({entry_id:id,voter_id:user.id});alert(error?(error.code==='23505'?'Already voted.':error.message):'Vote recorded.');reels()}
async function results(){const {data,error}=await sb.from('results').select('*').order('rank');app.innerHTML=error?notice(error.message,'err'):`<div class="card"><h2>🏆 Results</h2><div class="table"><table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Award</th><th>Prize</th></tr>${(data||[]).map(x=>`<tr><td>${x.rank}</td><td>${esc(x.registration_id)}</td><td>${esc(x.name)}</td><td>${esc(x.award)}</td><td>${esc(x.prize)}</td></tr>`).join('')}</table></div></div>`}
async function admin(){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(!p||!['admin','manager','judge'].includes(p.role))return app.innerHTML=notice('Admin/Jury access denied.','err');const {data:e}=await sb.from('entries').select('*').order('created_at',{ascending:false});app.innerHTML=`<div class="card"><h2>🔐 Admin / Jury</h2><p>${esc(user.email)} • ${esc(p.role)}</p><h3>Entries: ${(e||[]).length}</h3><div class="table"><table><tr><th>ID</th><th>Name</th><th>Status</th><th>Finalist</th><th>Votes</th><th>Action</th></tr>${(e||[]).map(x=>`<tr><td>${esc(x.registration_id)}</td><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${x.is_finalist?'Yes':'No'}</td><td>${x.public_votes||0}</td><td><button onclick="st('${x.registration_id}','Approved')">Approve</button> <button onclick="st('${x.registration_id}','Shortlisted')">Shortlist</button> <button onclick="st('${x.registration_id}','Finalist')">Finalist</button></td></tr>`).join('')}</table></div><h3>📅 Event Settings</h3><button class="btn purple" onclick="eventEdit()">EDIT EVENT</button> <button class="btn dark" onclick="logout()">LOGOUT</button></div>`}
async function st(id,status){const {error}=await sb.from('entries').update({status,is_finalist:status==='Finalist'}).eq('registration_id',id);if(error)alert(error.message);admin()}
async function eventEdit(){const {data}=await sb.from('event_settings').select('*').eq('id',1).single();app.innerHTML=`<div class="card"><h2>📅 Event Settings</h2><div class="grid"><div class="field"><label>Title</label><input id="et" value="${esc(data.event_title)}"></div><div class="field"><label>Date</label><input id="ed" value="${esc(data.event_date||'')}" type="date"></div><div class="field"><label>Time</label><input id="eti" value="${esc(data.event_time||'')}"></div><div class="field"><label>Venue</label><input id="ev" value="${esc(data.event_venue||'')}"></div><div class="field"><label>Registration End</label><input id="re" value="${esc(data.registration_end||'')}" type="datetime-local"></div><div class="field full"><label>Banner URL</label><input id="bu" value="${esc(data.banner_url||'')}"></div><div class="field full"><label>Description</label><textarea id="desc">${esc(data.event_description||'')}</textarea></div></div><br><button class="btn purple" onclick="saveEvent()">SAVE</button> <button class="btn dark" onclick="admin()">BACK</button></div>`}
async function saveEvent(){const patch={event_title:et.value,event_date:ed.value,event_time:eti.value,event_venue:ev.value,registration_end:re.value,banner_url:bu.value,event_description:desc.value};const {error}=await sb.from('event_settings').update(patch).eq('id',1);if(error)alert(error.message);else{Object.assign(eventData,patch);alert('Saved');admin()}}
async function logout(){await sb.auth.signOut();page('home')}
init();</script></body></html>
