dy><header class="hero"><b>Bhandara × Gondia • 2026</b><h1>GEN Z REEL FEST 2026</h1><p>तुमची कल्पना. तुमची Reel. तुमचा मंच.</p><div class="count"><div class="time"><b id="d">--</b>Days</div><div class="time"><b id="h">--</b>Hours</div><div class="time"><b id="m">--</b>Minutes</div><div class="time"><b id="s">--</b>Seconds</div></div><button class="btn" onclick="page('register')">REGISTER NOW</button><div class="links"><button class="btn" onclick="location.href='results-v10.html'">🏆 Official Results</button><button class="btn" onclick="location.href='verify-v12.html'">🔎 Verify Certificate</button><button class="btn" onclick="location.href='participant-v11.html'">👤 My Result</button></div></header><nav><button onclick="page('home')">Home</button><button onclick="page('about')">About</button><button onclick="page('rules')">Rules</button><button onclick="page('themes')">Themes</button><button onclick="page('prizes')">Prizes</button><button onclick="page('register')">Register Now</button><button onclick="page('status')">Check Status</button><button onclick="page('login')">Participant Login</button><button onclick="page('reels')">Top Reels</button><button onclick="page('results')">Results</button><button onclick="page('admin')">Admin / Jury</button></nav><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};let sb,eventData={};const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const notice=(x,c='ok')=>`<div class="${c}">${esc(x)}</div>`;const redirectUrl=()=>location.origin+location.pathname;const cleanUrl=()=>{if(location.hash)history.replaceState({},document.title,location.pathname+location.search)};function showRegistrationSuccess(id){app.innerHTML=`<div class="card success"><h2>✅ Registration Successful</h2><p>Your registration has been submitted successfully.</p><div class="rid">Registration ID: ${esc(id)}</div><p>कृपया हा Registration ID जतन करून ठेवा.</p><button class="btn purple" onclick="status()">CHECK STATUS</button> <button class="btn dark" onclick="page('home')">HOME</button></div>`}function showAuthError(){const q=new URLSearchParams(location.hash.slice(1));const code=q.get('error_code');if(!code)return false;const msg=code==='otp_expired'?'Email verification link expired किंवा already used आहे. कृपया Registration page वरून नवीन link मागवा.':(q.get('error_description')||'Email verification failed.');cleanUrl();app.innerHTML=`<div class="card err"><h2>⚠️ Email Verification</h2><p>${esc(msg)}</p><button class="btn purple" onclick="page('register')">BACK TO REGISTRATION</button></div>`;return true}async function init(){if(CONFIG.SUPABASE_URL.startsWith('PASTE_')||CONFIG.SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')){app.innerHTML='<div class="card"><h2>V6.0 Setup</h2><p>Add the Supabase URL and Publishable Key in index.html.</p></div>';return}sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY);if(showAuthError())return;await loadSettings();const handled=await completePendingRegistration();if(handled)return;const {data:{session}}=await sb.auth.getSession();if(session?.user){cleanUrl();await status();return}page('home')}async function loadSettings(){const {data}=await sb.from('event_settings').select('*').eq('id',1).maybeSingle();eventData=data||{};const t=Date.parse(eventData.registration_end);setInterval(()=>{if(!t)return;let x=Math.max(0,t-Date.now());d.textContent=Math.floor(x/86400000);h.textContent=Math.floor(x%86400000/3600000);m.textContent=Math.floor(x%3600000/60000);s.textContent=Math.floor(x%60000/1000)},1000)}async function completePendingRegistration(){const raw=localStorage.getItem('pending_genz_registration');if(!raw)return false;const {data:{session}}=await sb.auth.getSession();if(!session?.user)return false;let x;try{x=JSON.parse(raw)}catch{localStorage.removeItem('pending_genz_registration');return false}if(x.email&&session.user.email&&x.email.toLowerCase()!==session.user.email.toLowerCase())return false;x.user_id=session.user.id;x.consent=true;const {data:r,error}=await sb.from('entries').insert(x).select('registration_id').single();if(!error){localStorage.removeItem('pending_genz_registration');cleanUrl();showRegistrationSuccess(r.registration_id);return true}if(error.code==='23505'){const {data:existing}=await sb.from('entries').select('registration_id').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();localStorage.removeItem('pending_genz_registration');if(existing?.registration_id){cleanUrl();showRegistrationSuccess(existing.registration_id);return true}}app.innerHTML=notice(error?.message||'Registration could not be completed.','err');return true}async function page(p){if(!sb)return init();if(p==='home')return home();if(p==='about')return about();if(p==='rules')return rules();if(p==='themes')return themes();if(p==='prizes')return prizes();if(p==='register')return register();if(p==='login')return login();if(p==='status')return status();if(p==='reels')return reels();if(p==='results')return results();if(p==='admin')return admin()}function home(){app.innerHTML=`${eventData.banner_url?`<img class="banner" src="${esc(eventData.banner_url)}">`:''}<div class="card"><h2>${esc(eventData.event_title||'GEN Z REEL FEST 2026')}</h2><p>${esc(eventData.event_description||'तुमची कल्पना. तुमची Reel. तुमचा मंच.')}</p><div class="grid"><div><b>📅 Date</b><p>${esc(eventData.event_date||'To be announced')}</p></div><div><b>⏰ Time</b><p>${esc(eventData.event_time||'To be announced')}</p></div><div><b>📍 Venue</b><p>${esc(eventData.event_venue||'Bhandara × Gondia')}</p></div></div></div><div class="card" style="text-align:center"><h2>Quick Access</h2><div class="links"><button class="btn" onclick="location.href='results-v10.html'">🏆 Official Results</button><button class="btn" onclick="location.href='verify-v12.html'">🔎 Verify Certificate</button><button class="btn" onclick="location.href='participant-v11.html'">👤 My Result</button><button class="btn" onclick="location.href='certificate-v12.html'">🎖️ Digital Certificate</button></div></div>`}function about(){app.innerHTML='<div class="card"><h2>About Competition</h2><p>Bhandara आणि Gondia जिल्ह्यातील Gen Z creators साठी Reel Competition.</p></div>'}function rules(){app.innerHTML='<div class="card"><h2>Rules</h2><p>Original Reel, valid Instagram URL आणि आयोजकांच्या deadlines चे पालन आवश्यक.</p></div>'}function themes(){app.innerHTML='<div class="card"><h2>Themes</h2><p>Local Culture • Youth • Tourism • Social Message • Innovation • Local Connect</p></div>'}function prizes(){app.innerHTML='<div class="card"><h2>Prizes</h2><p>Winner • 1st Runner Up • 2nd Runner Up • Special Awards.</p></div>'}function field(l,n,t='text',r=false){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" ${r?'required':''}></div>`}function register(){app.innerHTML=`<div class="card"><h2>📝 Registration</h2><form id="rf" class="grid">${field('Full Name','name','text',true)}${field('Date of Birth','dob','date')}${field('District','district','text',true)}${field('Taluka','taluka')}${field('Village / City','village')}${field('Mobile','mobile','tel',true)}${field('WhatsApp','whatsapp','tel')}${field('Email','email','email',true)}${field('Instagram Username','instagram')}${field('YouTube Username','youtube')}${field('Reel Category','category','text',true)}${field('Reel Title','title','text',true)}${field('Reel URL','reel_url','url',true)}<div class="full"><label><input name="consent" type="checkbox" value="true" required> I accept the rules and publication consent.</label></div><div class="full"><button class="btn purple">SUBMIT ENTRY</button></div></form><div id="rm"></div></div>`;rf.onsubmit=submit}async function submit(e){e.preventDefault();const f=new FormData(rf),x=Object.fromEntries(f.entries());if(!eventData.registration_open){rm.innerHTML=notice('Registration is closed.','err');return}const {data:{session}}=await sb.auth.getSession();if(session?.user){x.user_id=session.user.id;x.consent=true;const {data:r,error}=await sb.from('entries').insert(x).select('registration_id').single();if(!error){rf.reset();showRegistrationSuccess(r.registration_id)}else if(error.code==='23505'){const {data:existing}=await sb.from('entries').select('registration_id').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(existing?.registration_id){rf.reset();showRegistrationSuccess(existing.registration_id)}else rm.innerHTML=notice(error.message,'err')}else rm.innerHTML=notice(error.message,'err');return}localStorage.setItem('pending_genz_registration',JSON.stringify(x));const {error:ae}=await sb.auth.signInWithOtp({email:x.email,options:{shouldCreateUser:true,emailRedirectTo:redirectUrl()}});if(ae){localStorage.removeItem('pending_genz_registration');rm.innerHTML=notice(ae.message,'err');return}rm.innerHTML=notice('Registration details saved. Please check your email and click the login/confirmation link. After clicking it, your registration will be submitted automatically.')}function login(){app.innerHTML=`<div class="card"><h2>👤 Participant Login</h2><div class="field"><label>Email</label><input id="le" type="email"></div><br><button class="btn purple" onclick="sendLogin()">SEND LOGIN LINK</button><div id="lm"></div></div>`}async function sendLogin(){const email=le.value.trim();if(!email){lm.innerHTML=notice('Please enter your email.','err');return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirectUrl()}});lm.innerHTML=error?notice(error.message,'err'):notice('Login link sent to your email.')}async function status(){const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user)return login();const {data,error}=await sb.from('entries').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){app.innerHTML=notice(error.message,'err');return}app.innerHTML=`<div class="card"><h2>📊 My Entries</h2><p>Logged in as <b>${esc(user.email)}</b></p>${(data||[]).length?(data||[]).map(x=>`<div class="card"><b>${esc(x.registration_id)}</b><p>${esc(x.name||'')} • ${esc(x.title||'')} • ${esc(x.status||'')}</p><p>District: ${esc(x.district||'')} • Votes: ${x.public_votes||0}</p>${x.reel_url?`<a class="btn" target="_blank" href="${esc(x.reel_url)}">VIEW REEL</a>`:''}</div>`).join(''):'<div class="ok">No registration found for this email yet.</div>'}<button class="btn dark" onclick="logout()">LOGOUT</button></div>`}async function reels(){const {data,error}=await sb.from('entries').select('*').eq('is_finalist',true).eq('status','Finalist').order('public_votes',{ascending:false});if(error)return app.innerHTML=notice(error.message,'err');app.innerHTML=`<div class="card"><h2>🔥 TOP REELS</h2><div class="grid">${(data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.title)} • ${esc(x.category)}</p><p>❤️ ${x.public_votes||0}</p><a class="btn" target="_blank" href="${esc(x.reel_url)}">VIEW REEL</a> <button class="btn purple" onclick="vote('${x.id}')">VOTE</button></div>`).join('')}</div></div>`}async function vote(id){const {data:{user}}=await sb.auth.getUser();if(!user)return login();const {error}=await sb.from('votes').insert({entry_id:id,voter_id:user.id});alert(error?(error.code==='23505'?'Already voted.':error.message):'Vote recorded.');reels()}async function results(){const {data,error}=await sb.from('results').select('*').order('rank');app.innerHTML=error?notice(error.message,'err'):`<div class="card"><h2>🏆 Results</h2><div class="table"><table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Award</th><th>Prize</th></tr>${(data||[]).map(x=>`<tr><td>${x.rank}</td><td>${esc(x.registration_id)}</td><td>${esc(x.name)}</td><td>${esc(x.award)}</td><td>${esc(x.prize)}</td></tr>`).join('')}</table></div></div>`}async function admin(){location.href='admin-v31.html?v='+Date.now()}async function logout(){await sb.auth.signOut();page('home')}init();</script></body></html>
