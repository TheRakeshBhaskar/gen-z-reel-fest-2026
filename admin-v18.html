<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#312e81"><title>Admin & Jury V18 - GEN Z REEL FEST 2026</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.wrap{max-width:1200px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#111827,#312e81,#7c3aed);color:#fff;text-align:center;border-radius:18px;padding:28px 16px}.hero h1{margin:5px 0;font-size:clamp(28px,6vw,48px)}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8f9fc;padding:14px;border-radius:13px}.num{font-size:27px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px;font-weight:800}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;margin:3px}.dark{background:#111827}.green{background:#067647}.gold{background:#f59e0b;color:#111}.muted{color:#667085}.ok{background:#ecfdf3;padding:12px;border-radius:9px}.err{background:#fef2f2;padding:12px;border-radius:9px;color:#b42318}.filters{display:grid;grid-template-columns:2fr 160px;gap:10px}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:9px;width:100%}.table{overflow:auto}.table table{width:100%;min-width:900px;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.top{background:#fffbeb}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.hero{border-radius:12px}.btn{width:100%;margin:4px 0}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"></main><script>const CONFIG={SUPABASE_URL:'https://tewprfdirrhpaowvqyhj.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY),app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let role='',entries=[],scores=[];async function init(){const{data:{user}}=await sb.auth.getUser();if(!user)return login();const{data:p,error}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error||!p||!['admin','manager','judge'].includes(p.role)){app.innerHTML='<div class="card err"><h2>🔒 Access denied</h2><p>Admin, Manager or Judge access is required.</p><button class="btn" onclick="logout()">BACK</button></div>';return}role=p.role;dashboard(user.email)}function login(){app.innerHTML='<div class="card" style="max-width:520px;margin:60px auto"><h2>🔐 Admin / Jury Login</h2><p class="muted">Use your authorized account email.</p><input id="email" type="email" placeholder="Authorized email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function dashboard(email){app.innerHTML='<section class="hero"><h1>🏆 GEN Z REEL FEST 2026</h1><p>V18 Admin & Jury Dashboard</p><span class="badge">ROLE: '+esc(role.toUpperCase())+'</span></section><div class="card"><p><b>Signed in:</b> '+esc(email)+'</p><div class="grid" id="stats"></div></div><div class="card"><h2>📋 Entries</h2><div class="filters"><input id="q" placeholder="Search registration, name, reel, district" oninput="render()"><select id="scope" onchange="render()"><option value="all">All entries</option><option value="finalists">Finalists only</option></select></div></div><div class="card"><div id="table"></div></div><div class="card '+(role==='admin'?'':'hidden')+'"><h2>👑 Admin Controls</h2><p class="muted">Only Admin can publish official results. Database RLS remains the final authority.</p><button class="btn gold" onclick="publishTop3()">PUBLISH TOP 3</button><button class="btn dark" onclick="location.href='results-v10.html'">VIEW OFFICIAL RESULTS</button></div><div class="card"><button class="btn dark" onclick="logout()">LOGOUT</button></div>';await load()}async function load(){const a=await sb.from('entries').select('id,registration_id,name,title,district,category,status,is_finalist,public_votes,created_at').order('created_at',{ascending:true});if(a.error)return fail(a.error.message);entries=a.data||[];const j=await sb.from('jury_scores').select('entry_id,judge_id,total');if(j.error)return fail(j.error.message);scores=j.data||[];render()}function fail(m){app.innerHTML='<div class="card err"><h2>Could not load dashboard</h2><p>'+esc(m)+'</p></div>'}function calc(){const by={};scores.forEach(s=>(by[s.entry_id]??=[]).push(Number(s.total)||0));return entries.filter(e=>by[e.id]?.length).map(e=>{const avg=by[e.id].reduce((a,b)=>a+b,0)/by[e.id].length;return {...e,judges:by[e.id].length,jury:(avg/120)*100}}).sort((a,b)=>b.jury-a.jury||Number(b.public_votes||0)-Number(a.public_votes||0))}function render(){const rows0=calc(),q=(document.getElementById('q')?.value||'').toLowerCase(),scope=document.getElementById('scope')?.value||'all';const rows=rows0.filter(e=>(scope==='all'||e.is_finalist)&&[e.registration_id,e.name,e.title,e.district,e.category].join(' ').toLowerCase().includes(q));stats.innerHTML='<div class="stat"><b>Total Entries</b><div class="num">'+entries.length+'</div></div><div class="stat"><b>Scored</b><div class="num">'+rows0.length+'</div></div><div class="stat"><b>Finalists</b><div class="num">'+entries.filter(e=>e.is_finalist).length+'</div></div><div class="stat"><b>Public Votes</b><div class="num">'+entries.reduce((a,e)=>a+Number(e.public_votes||0),0)+'</div></div>';table.innerHTML=rows.length?'<div class="table"><table><tr><th>Registration</th><th>Name</th><th>Reel</th><th>District</th><th>Category</th><th>Finalist</th><th>Jury Score</th><th>Judges</th><th>Votes</th></tr>'+rows.map(e=>'<tr class="'+(e.is_finalist?'top':'')+'"><td>'+esc(e.registration_id)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.title)+'</td><td>'+esc(e.district)+'</td><td>'+esc(e.category)+'</td><td>'+(e.is_finalist?'✅':'—')+'</td><td>'+e.jury.toFixed(2)+'/100</td><td>'+e.judges+'</td><td>'+Number(e.public_votes||0)+'</td></tr>').join('')+'</table></div>':'<p class="muted">No scored entries found.</p>'}async function publishTop3(){if(role!=='admin')return alert('Admin only.');const rows=calc().filter(e=>e.is_finalist).slice(0,3);if(rows.length<3)return alert('At least 3 scored finalists are required.');const payload=rows.map((e,i)=>({registration_id:e.registration_id,name:e.name,rank:i+1,award:i===0?'Winner':i===1?'1st Runner Up':'2nd Runner Up'}));const ins=await sb.from('results').upsert(payload,{onConflict:'registration_id'});if(ins.error)return alert(ins.error.message);alert('Top 3 published successfully.');location.href='results-v10.html'}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
