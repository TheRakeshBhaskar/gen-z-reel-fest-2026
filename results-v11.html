<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#312e81">
<title>🏆 GEN Z REEL FEST 2026 - Official Results</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#101828}.hero{padding:42px 15px;text-align:center;color:#fff;background:linear-gradient(135deg,#111827,#312e81,#7c3aed)}.hero h1{font-size:clamp(30px,6vw,58px);margin:8px 0}.hero p{margin:5px;opacity:.92}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 8px 25px #1018280a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8f9fc;border-radius:14px;padding:14px}.num{font-size:28px;font-weight:900;margin-top:4px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}.place{border:1px solid #e4e7ec;border-radius:18px;padding:18px;text-align:center;background:#fff}.place.first{padding-top:28px;padding-bottom:28px;background:#fffbeb}.medal{font-size:44px}.award{font-weight:800}.name{font-size:22px;font-weight:900;margin:8px 0}.id{font-size:12px;background:#eef2ff;padding:5px 9px;border-radius:99px;display:inline-block;overflow-wrap:anywhere}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff;text-decoration:none}.dark{background:#111827}.muted{color:#667085}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.table th{background:#f9fafb}.rank{font-size:22px;font-weight:900}.top{background:#fffbeb}.empty{text-align:center;padding:35px}.notice{padding:16px;border-radius:12px;background:#fef2f2;color:#b42318;white-space:pre-wrap}.updated{text-align:center;font-size:13px;color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.winnerLink{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#5b21b6;text-decoration:none}.loading{display:flex;justify-content:center;align-items:center;gap:10px}.spinner{width:18px;height:18px;border:3px solid #ddd;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.podium{grid-template-columns:1fr}.place.first{order:-1}.hero{padding:32px 12px}.card{padding:14px}.actions .btn{width:100%;text-align:center}}@media(max-width:430px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style>
</head>
<body>
<header class="hero"><div>🏆 Bhandara × Gondia • 2026</div><h1>GEN Z REEL FEST 2026</h1><p>तुमची कल्पना. तुमची Reel. तुमचा मंच.</p><p><b>OFFICIAL RESULTS</b></p></header>
<main class="wrap"><section id="app"><div class="card empty loading"><span class="spinner"></span><span>Results loading...</span></div></section></main>
<script>
(function(){
'use strict';
const URL='https://tewprfdirrhpaowvqyhj.supabase.co';
const KEY='sb_publishable_-9c3fvGnXlWRvKESi042iA_PYkj9e7j';
const app=document.getElementById('app');
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(table,query){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),12000);
 try{
  const r=await fetch(URL+'/rest/v1/'+table+'?'+query,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store',signal:controller.signal});
  const text=await r.text();
  let data;try{data=text?JSON.parse(text):null}catch{data=null}
  if(!r.ok)throw new Error((data&&data.message)||('Supabase HTTP '+r.status));
  return data||[];
 }catch(e){if(e.name==='AbortError')throw new Error('Supabase request timed out after 12 seconds. Please check Supabase/API access.');throw e}
 finally{clearTimeout(timer)}
}
function error(e){const msg=e&&e.message?e.message:String(e||'Unknown error');app.innerHTML='<div class="card notice"><h2>⚠️ Results could not be loaded</h2><p>'+esc(msg)+'</p><p class="muted">The page itself is working. The problem is the connection to the results database.</p><div class="actions"><button class="btn" onclick="load()">↻ TRY AGAIN</button><button class="btn dark" onclick="location.reload()">↻ RELOAD</button></div></div>';console.error(e)}
window.load=load;
async function load(){
 app.innerHTML='<div class="card empty loading"><span class="spinner"></span><span>Loading official results...</span></div>';
 try{
  const results=await api('results','select=registration_id,name,rank,award&order=rank.asc');
  const ids=results.map(x=>x.registration_id).filter(Boolean);
  let entries=[];
  if(ids.length){
   const encoded=ids.map(id=>encodeURIComponent(id)).join(',');
   entries=await api('entries','select=registration_id,name,title,district,category,public_votes,is_finalist&registration_id=in.('+encoded+')');
  }
  let settings=[];
  try{settings=await api('event_settings','select=event_title,event_description,event_date,event_time,event_venue,event_organizer,result_date&id=eq.1');}catch(e){console.warn('Event settings unavailable:',e)}
  render(results,entries,settings[0]||{});
 }catch(e){error(e)}
}
function render(results,entries,settings){
 if(!results.length){app.innerHTML='<div class="card empty"><h2>🏆 Results will be announced here</h2><p class="muted">Official results have not been published yet.</p><div class="actions"><button class="btn" onclick="load()">↻ Refresh</button></div></div>';return}
 const byId={};entries.forEach(e=>byId[e.registration_id]=e);
 const totalVotes=entries.reduce((a,e)=>a+(Number(e.public_votes)||0),0);
 const podium=results.slice(0,3).map((r,i)=>{const e=byId[r.registration_id]||{};return '<div class="place '+(i===0?'first':'')+'"><div class="medal">'+(i===0?'🥇':i===1?'🥈':'🥉')+'</div><div class="award">'+esc(r.award||('Rank '+r.rank))+'</div><div class="name">'+esc(r.name)+'</div><span class="id">'+esc(r.registration_id)+'</span><p>'+esc(e.title||'')+'</p><p class="muted">'+esc(e.district||'')+(e.category?' • '+esc(e.category):'')+'</p>'+(e.public_votes!=null?'<b>❤️ '+esc(e.public_votes)+' public votes</b>':'')+(r.award&&String(r.award).toLowerCase().includes('winner')?'<br><a class="winnerLink" href="certificate-v12.html">🎖️ Certificate</a>':'')+'</div>'}).join('');
 const rows=results.map((r,i)=>{const e=byId[r.registration_id]||{};return '<tr class="'+(i<3?'top':'')+'"><td><span class="rank">'+esc(r.rank||i+1)+'</span></td><td>'+esc(r.registration_id)+'</td><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.award||'-')+'</td><td>'+esc(e.title||'-')+'</td><td>'+esc(e.district||'-')+'</td><td>'+esc(e.category||'-')+'</td></tr>'}).join('');
 app.innerHTML='<div class="card"><div class="grid"><div class="stat"><b>Published Winners</b><div class="num">'+results.length+'</div></div><div class="stat"><b>Public Votes</b><div class="num">'+totalVotes+'</div></div><div class="stat"><b>Event</b><div class="num" style="font-size:18px">'+esc(settings.event_title||'GEN Z REEL FEST 2026')+'</div></div></div></div><div class="card"><h2 style="text-align:center">🥇 TOP 3 WINNERS</h2><div class="podium">'+podium+'</div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>📊 Official Ranking</h2><div class="actions"><button class="btn dark" onclick="window.print()">🖨️ Print / PDF</button><button class="btn" onclick="load()">↻ Refresh</button></div></div><div class="table"><table><tr><th>Rank</th><th>Registration ID</th><th>Name</th><th>Award</th><th>Reel</th><th>District</th><th>Category</th></tr>'+rows+'</table></div></div><div class="card" style="text-align:center"><h2>🎉 Congratulations!</h2><p>'+esc(settings.event_description||'GEN Z REEL FEST 2026')+'</p><p class="muted">Official results published by '+esc(settings.event_organizer||'GEN Z REEL FEST 2026')+'</p><div class="actions"><button class="btn" onclick="location.href='./'">← Back to Festival Website</button><button class="btn dark" onclick="location.href='verify-v12.html'">🔎 Verify Certificate</button></div></div><div class="updated">Last checked: '+new Date().toLocaleString()+' • Automatically refreshes every 30 seconds.</div>';
}
load();setInterval(load,30000);
})();
</script>
</body>
</html>
