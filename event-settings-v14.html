'admin')return app.innerHTML='<div class="card err"><h2>Access denied</h2><p>Admin access required.</p></div>';await load()}function login(){app.innerHTML='<div class="card"><h1>⚙️ Event Operations V14</h1><p class="muted">Admin login required.</p><input id="email" type="email" placeholder="Admin email"><br><br><button class="btn" onclick="send()">SEND LOGIN LINK</button><div id="msg"></div></div>'}async function send(){const e=email.value.trim();if(!e)return;const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href.split('#')[0]}});msg.innerHTML=error?'<div class="err">'+esc(error.message)+'</div>':'<div class="ok">Login link sent. Check your email.</div>'}async function load(){const{data,error}=await sb.from('event_settings').select('*').limit(1).maybeSingle();if(error)return app.innerHTML='<div class="card err"><h2>Settings table unavailable</h2><p>'+esc(error.message)+'</p><p class="muted">Create the event_settings table before using V14.</p></div>';settings=data||{event_name:'GEN Z REEL FEST 2026',registration_open:true,voting_open:false,results_published:false,maintenance_mode:false,registration_deadline:'',voting_start:'',voting_end:'',max_registrations:0,announcement:''};render()}function render(){app.innerHTML='<div class="card"><h1>⚙️ Event Operations V14</h1><p class="muted">Central control for registration, voting, results and public announcements.</p></div><div class="card"><h2>Event</h2><div class="grid"><div class="field"><label>Event Name</label><input id="event_name" value="'+esc(settings.event_name)+'"></div><div class="field"><label>Maximum Registrations (0 = unlimited)</label><input id="max_registrations" type="number" min="0" value="'+Number(settings.max_registrations||0)+'"></div><div class="field"><label>Registration Deadline</label><input id="registration_deadline" type="datetime-local" value="'+dt(settings.registration_deadline)+'"></div><div class="field"><label>Voting Start</label><input id="voting_start" type="datetime-local" value="'+dt(settings.voting_start)+'"></div><div class="field"><label>Voting End</label><input id="voting_end" type="datetime-local" value="'+dt(settings.voting_end)+'"></div></div><br><div class="field"><label>Public Announcement</label><textarea id="announcement" rows="4">'+esc(settings.announcement)+'</textarea></div></div><div class="card"><h2>Live Controls</h2><div class="grid"><label class="toggle"><span><b>Registration Open</b><br><small>Allow new registrations</small></span><input id="registration_open" type="checkbox" '+(settings.registration_open?'checked':'')+'></label><label class="toggle"><span><b>Public Voting Open</b><br><small>Allow public votes</small></span><input id="voting_open" type="checkbox" '+(settings.voting_open?'checked':'')+'></label><label class="toggle"><span><b>Results Published</b><br><small>Show official results</small></span><input id="results_published" type="checkbox" '+(settings.results_published?'checked':'')+'></label><label class="toggle"><span><b>Maintenance Mode</b><br><small>Temporarily restrict public pages</small></span><input id="maintenance_mode" type="checkbox" '+(settings.maintenance_mode?'checked':'')+'></label></div></div><div class="card"><button class="btn" onclick="save()">SAVE EVENT SETTINGS</button> <button class="btn dark" onclick="logout()">LOGOUT</button><div id="msg"></div></div>'}function dt(v){if(!v)return '';const d=new Date(v);if(isNaN(d))return '';const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}async function save(){const payload={event_name:event_name.value.trim(),max_registrations:Number(max_registrations.value)||0,registration_deadline:registration_deadline.value?new Date(registration_deadline.value).toISOString():null,voting_start:voting_start.value?new Date(voting_start.value).toISOString():null,voting_end:voting_end.value?new Date(voting_end.value).toISOString():null,announcement:announcement.value.trim(),registration_open:registration_open.checked,voting_open:voting_open.checked,results_published:results_published.checked,maintenance_mode:maintenance_mode.checked,updated_at:new Date().toISOString()};const{data:{user}}=await sb.auth.getUser();const id=settings.id;if(!id){payload.created_by=user.id;const{error}=await sb.from('event_settings').insert(payload);if(error)return msg.innerHTML='<div class="err">'+esc(error.message)+'</div>'}else{const{error}=await sb.from('event_settings').update(payload).eq('id',id);if(error)return msg.innerHTML='<div class="err">'+esc(error.message)+'</div>'}msg.innerHTML='<div class="ok">✅ Event settings saved successfully.</div>';await load()}async function logout(){await sb.auth.signOut();login()}init();</script></body></html>
